<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Golf Yardage</title>
    <link rel="manifest" href="manifest.json">
    <!-- モバイル向け設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* スマホのツールバー対策: 100dvh (Dynamic Viewport Height) を使用 */
        body {
            height: 100vh; /* fallback */
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background-color: #111827;
            margin: 0;
            overflow: hidden;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* 切り替えボタンのスタイルをより明確に */
        .view-btn-active { 
            background-color: #16a34a !important; 
            color: white !important; 
            border: 2px solid #4ade80 !important;
        }
        .view-btn-inactive { 
            background-color: #374151 !important; 
            color: #9ca3af !important;
            border: 2px solid transparent !important;
        }
        /* ボタンの押し心地 */
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <!-- Header (コース名) -->
    <header class="bg-gray-800 p-2 flex justify-between items-center shrink-0 border-b border-gray-700">
        <div class="flex-1 overflow-hidden px-2">
            <h1 id="display-course" class="text-[10px] text-gray-400 truncate tracking-widest uppercase">Select Course</h1>
            <div id="display-section" class="text-base font-bold leading-tight text-green-400">コース未選択</div>
        </div>
        <button onclick="toggleSettings()" class="p-2 bg-gray-700 rounded-full">
            <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
    </header>

    <!-- Hole Nav (H1-H9) -->
    <nav class="bg-gray-800 shrink-0 shadow-lg">
        <div id="hole-tabs" class="flex overflow-x-auto no-scrollbar py-2 px-4 gap-3">
            <!-- JSで生成 -->
        </div>
    </nav>

    <!-- Main Image (画像表示エリア) -->
    <main class="flex-1 relative bg-black flex items-center justify-center overflow-hidden" onclick="openFullscreen()">
        <div id="loading-spinner" class="absolute inset-0 flex items-center justify-center bg-gray-900 z-0">
            <div class="animate-spin h-8 w-8 border-4 border-green-500 border-t-transparent rounded-full"></div>
        </div>
        
        <img id="main-image" src="" class="max-h-full max-w-full object-contain z-10 relative">
        
        <div class="absolute top-4 left-4 z-20 bg-black/60 backdrop-blur-sm px-4 py-1 rounded-xl border border-white/10">
            <div id="info-hole" class="text-3xl font-black italic text-white leading-none">H-</div>
            <div id="info-par" class="text-[10px] font-bold text-green-400 text-center uppercase">PAR -</div>
        </div>
    </main>

    <!-- Footer Switch (★ここを絶対に表示させる修正★) -->
    <footer class="bg-gray-800 p-3 shrink-0 border-t border-gray-700 shadow-[0_-4px_10px_rgba(0,0,0,0.3)] z-30">
        <div class="flex bg-gray-900 rounded-xl p-1 gap-1 w-full max-w-md mx-auto">
            <button onclick="setView('map')" id="btn-map" class="flex-1 py-3 rounded-lg font-bold text-sm transition-all view-btn-active">
                全体図
            </button>
            <button onclick="setView('green')" id="btn-green" class="flex-1 py-3 rounded-lg font-bold text-sm transition-all view-btn-inactive">
                グリーン
            </button>
        </div>
        <!-- iPhoneのホームバー用の余白 -->
        <div class="h-2"></div>
    </footer>

    <!-- Settings Overlay -->
    <div id="settings-overlay" class="fixed inset-0 bg-gray-900/98 z-50 p-8 hidden flex-col">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-2xl font-bold">Settings</h2>
            <button onclick="toggleSettings()" class="text-4xl text-gray-500 p-2">&times;</button>
        </div>
        <div class="space-y-6">
            <select id="course-select" class="w-full bg-gray-800 p-4 rounded-xl text-lg text-white border border-gray-700"></select>
            <select id="section-select" class="w-full bg-gray-800 p-4 rounded-xl text-lg text-white border border-gray-700"></select>
            <input type="file" id="csv-file" accept=".csv" class="hidden">
            <button onclick="document.getElementById('csv-file').click()" class="w-full py-5 bg-green-600 rounded-2xl font-bold text-lg">CSVデータを読込</button>
        </div>
    </div>

    <!-- Fullscreen Overlay -->
    <div id="fullscreen-overlay" class="fixed inset-0 bg-black z-[60] hidden items-center justify-center" onclick="this.classList.add('hidden')">
        <img id="fullscreen-image" src="" class="w-full h-full object-contain">
    </div>

    <script>
        let courseData = {};
        let state = { course: "", section: "", hole: 1, view: "map" };

        function init() {
            const container = document.getElementById('hole-tabs');
            for(let i=1; i<=9; i++) {
                const btn = document.createElement('button');
                btn.id = `btn-h${i}`;
                btn.className = `flex-shrink-0 w-12 h-12 rounded-lg bg-gray-700 font-bold text-lg text-white transition-all`;
                btn.innerText = i;
                btn.onclick = () => setHole(i);
                container.appendChild(btn);
            }

            document.getElementById('csv-file').onchange = (e) => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    parseCSV(ev.target.result);
                    localStorage.setItem('golf_db_final', ev.target.result);
                    toggleSettings();
                };
                reader.readAsText(e.target.files[0]);
            };

            const saved = localStorage.getItem('golf_db_final');
            if(saved) parseCSV(saved);
        }

        function parseCSV(csv) {
            const lines = csv.split(/\r?\n/);
            courseData = {};
            let lastCourse = "";
            lines.forEach(line => {
                const cols = line.split(',').map(c => c.trim());
                if(cols.includes('H1')) {
                    lastCourse = cols[0];
                    courseData[lastCourse] = {};
                } else if(lastCourse && cols.length >= 10 && cols[1] !== "") {
                    courseData[lastCourse][cols[0]] = cols.slice(1, 10).map(Number);
                }
            });
            updateCourseOptions();
        }

        function updateCourseOptions() {
            const sel = document.getElementById('course-select');
            const courses = Object.keys(courseData);
            if(courses.length === 0) return;
            sel.innerHTML = courses.map(c => `<option value="${c}">${c}</option>`).join('');
            state.course = courses[0];
            updateSectionOptions();
        }

        function updateSectionOptions() {
            const sel = document.getElementById('section-select');
            const sections = Object.keys(courseData[state.course]);
            sel.innerHTML = sections.map(s => `<option value="${s}">${s}</option>`).join('');
            state.section = sections[0];
            render();
        }

        function setHole(h) { state.hole = h; render(); }
        function setView(v) { state.view = v; render(); }

        function render() {
            if(!state.course || !state.section) return;

            document.getElementById('display-course').innerText = state.course;
            document.getElementById('display-section').innerText = state.section;
            document.getElementById('info-hole').innerText = `H${state.hole}`;
            document.getElementById('info-par').innerText = `PAR ${courseData[state.course][state.section][state.hole-1]}`;
            
            document.getElementById('loading-spinner').style.display = 'flex';
            const imgPath = `img/${state.course}_${state.section}_${state.hole}_${state.view}.jpg`;
            document.getElementById('main-image').src = imgPath + "?t=" + new Date().getTime();

            // Hole styles
            for(let i=1; i<=9; i++) {
                const el = document.getElementById(`btn-h${i}`);
                if(i === state.hole) el.className = "flex-shrink-0 w-12 h-12 rounded-lg bg-green-600 font-bold text-lg text-white scale-110 ring-2 ring-white/20";
                else el.className = "flex-shrink-0 w-12 h-12 rounded-lg bg-gray-700 font-bold text-lg text-white";
            }

            // View switch styles
            document.getElementById('btn-map').className = `flex-1 py-3 rounded-lg font-bold text-sm transition-all ${state.view==='map' ? 'view-btn-active' : 'view-btn-inactive'}`;
            document.getElementById('btn-green').className = `flex-1 py-3 rounded-lg font-bold text-sm transition-all ${state.view==='green' ? 'view-btn-active' : 'view-btn-inactive'}`;
        }

        function toggleSettings() { document.getElementById('settings-overlay').classList.toggle('hidden'); }
        
        function openFullscreen() {
            const overlay = document.getElementById('fullscreen-overlay');
            document.getElementById('fullscreen-image').src = document.getElementById('main-image').src;
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
        }

        init();
    </script>
</body>
</html>
