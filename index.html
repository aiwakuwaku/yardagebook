<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Golf Yardage PWA</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* スクロールバー非表示 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* スナップスクロール */
        .hole-scroll { scroll-snap-type: x mandatory; }
        .hole-item { scroll-snap-align: center; }
        /* アクティブ状態 */
        .active-hole { background-color: #16a34a !important; color: white !important; transform: scale(1.1); }
        /* 画像全画面表示用 */
        #fullscreen-overlay { display: none; }
        #fullscreen-overlay.active { display: flex; }
    </style>
</head>
<body class="bg-gray-900 text-white overflow-hidden h-screen flex flex-col">

    <!-- Header: コース選択 -->
    <header class="bg-gray-800 p-3 shadow-lg flex justify-between items-center">
        <div class="flex-1 overflow-hidden">
            <h1 id="display-course" class="text-xs text-gray-400 truncate">Course Not Selected</h1>
            <div id="display-section" class="text-lg font-bold leading-none">Select CSV →</div>
        </div>
        <button onclick="toggleSettings()" class="p-2 bg-gray-700 rounded-lg">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </button>
    </header>

    <!-- Hole Navigation: 横スクロール -->
    <nav class="bg-gray-800 border-b border-gray-700">
        <div id="hole-tabs" class="flex overflow-x-auto no-scrollbar py-3 px-4 gap-4 hole-scroll">
            <!-- JSで H1-H9 を生成 -->
        </div>
    </nav>

    <!-- Main Content: Yardage Image -->
    <main class="flex-1 relative bg-black flex items-center justify-center overflow-hidden" onclick="openFullscreen()">
        <img id="main-image" src="" class="max-h-full max-w-full object-contain" alt="Yardage View">
        
        <!-- Hole/Par Info Overlay -->
        <div class="absolute top-4 left-4 bg-black/60 backdrop-blur-md px-4 py-2 rounded-xl border border-white/20">
            <div id="info-hole" class="text-3xl font-black italic italic">H1</div>
            <div id="info-par" class="text-sm font-bold text-green-400">PAR 4</div>
        </div>

        <!-- Zoom Hint -->
        <div class="absolute bottom-4 right-4 text-white/40 text-xs">Tap to zoom</div>
    </main>

    <!-- Footer: ビュー切り替えボタン -->
    <footer class="bg-gray-800 grid grid-cols-2 gap-0.5 p-1 border-t border-gray-700">
        <button onclick="setView('map')" id="btn-map" class="py-4 font-bold text-sm bg-green-700 rounded-l-xl">全体図</button>
        <button onclick="setView('green')" id="btn-green" class="py-4 font-bold text-sm bg-gray-700 rounded-r-xl">グリーン周り</button>
    </footer>

    <!-- Settings Overlay -->
    <div id="settings-overlay" class="fixed inset-0 bg-black/90 z-50 p-6 hidden flex-col">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-bold">Settings</h2>
            <button onclick="toggleSettings()" class="text-3xl">&times;</button>
        </div>
        
        <div class="space-y-6">
            <div>
                <label class="block text-sm text-gray-400 mb-2">コース選択</label>
                <select id="course-select" class="w-full bg-gray-800 p-4 rounded-xl text-lg"></select>
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">セクション選択</label>
                <select id="section-select" class="w-full bg-gray-800 p-4 rounded-xl text-lg"></select>
            </div>
            <div class="pt-10">
                <input type="file" id="csv-file" accept=".csv" class="hidden">
                <button onclick="document.getElementById('csv-file').click()" class="w-full py-4 bg-blue-600 rounded-xl font-bold">CSVデータを読み込む</button>
            </div>
        </div>
    </div>

    <!-- Fullscreen View -->
    <div id="fullscreen-overlay" class="fixed inset-0 bg-black z-[60] hidden flex-col items-center justify-center" onclick="closeFullscreen()">
        <img id="fullscreen-image" src="" class="w-full h-full object-contain">
        <button class="absolute top-6 right-6 text-white bg-black/50 w-12 h-12 rounded-full text-2xl">&times;</button>
    </div>

    <script>
        let courseData = {};
        let state = { course: "", section: "", hole: 1, view: "map" };

        function init() {
            // ホールボタン生成
            const container = document.getElementById('hole-tabs');
            for(let i=1; i<=9; i++) {
                const btn = document.createElement('button');
                btn.id = `btn-h${i}`;
                btn.className = `hole-item flex-shrink-0 w-14 h-14 rounded-full bg-gray-700 font-bold text-xl transition-all`;
                btn.innerText = i;
                btn.onclick = () => setHole(i);
                container.appendChild(btn);
            }

            // CSV読込処理
            document.getElementById('csv-file').onchange = (e) => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    parseCSV(ev.target.result);
                    localStorage.setItem('golf_db', ev.target.result);
                    toggleSettings();
                };
                reader.readAsText(e.target.files[0]);
            };

            const saved = localStorage.getItem('golf_db');
            if(saved) parseCSV(saved);

            document.getElementById('course-select').onchange = (e) => {
                state.course = e.target.value;
                updateSectionOptions();
            };
            document.getElementById('section-select').onchange = (e) => {
                state.section = e.target.value;
                render();
            };
        }

        function parseCSV(csv) {
            const lines = csv.split(/\r?\n/);
            courseData = {};
            let lastCourse = "";
            lines.forEach(line => {
                const cols = line.split(',').map(c => c.trim());
                if(cols.includes('H1')) {
                    lastCourse = cols[0];
                    courseData[lastCourse] = {};
                } else if(lastCourse && cols.length >= 10 && cols[1] !== "") {
                    courseData[lastCourse][cols[0]] = cols.slice(1, 10).map(Number);
                }
            });
            updateCourseOptions();
        }

        function updateCourseOptions() {
            const sel = document.getElementById('course-select');
            const courses = Object.keys(courseData);
            sel.innerHTML = courses.map(c => `<option value="${c}">${c}</option>`).join('');
            if(courses.length > 0) {
                state.course = courses[0];
                updateSectionOptions();
            }
        }

        function updateSectionOptions() {
            const sel = document.getElementById('section-select');
            const sections = Object.keys(courseData[state.course]);
            sel.innerHTML = sections.map(s => `<option value="${s}">${s}</option>`).join('');
            if(sections.length > 0) {
                state.section = sections[0];
                render();
            }
        }

        function setHole(h) {
            state.hole = h;
            render();
        }

        function setView(v) {
            state.view = v;
            render();
        }

        function render() {
            if(!state.course || !state.section) return;

            // UI更新
            document.getElementById('display-course').innerText = state.course;
            document.getElementById('display-section').innerText = state.section;
            document.getElementById('info-hole').innerText = `H${state.hole}`;
            const par = courseData[state.course][state.section][state.hole-1];
            document.getElementById('info-par').innerText = `PAR ${par}`;

            // 画像パス更新 (img/コース名_セクション_H1_map.jpg)
            const imgPath = `img/${state.course}_${state.section}_${state.hole}_${state.view}.jpg`;
            document.getElementById('main-image').src = imgPath;

            // ボタン状態更新
            for(let i=1; i<=9; i++) {
                document.getElementById(`btn-h${i}`).className = `hole-item flex-shrink-0 w-14 h-14 rounded-full bg-gray-700 font-bold text-xl transition-all ${i===state.hole ? 'active-hole' : ''}`;
            }
            document.getElementById('btn-map').className = `py-4 font-bold text-sm rounded-l-xl ${state.view==='map' ? 'bg-green-600' : 'bg-gray-700'}`;
            document.getElementById('btn-green').className = `py-4 font-bold text-sm rounded-r-xl ${state.view==='green' ? 'bg-green-600' : 'bg-gray-700'}`;
            
            // スムーススクロール
            const activeBtn = document.getElementById(`btn-h${state.hole}`);
            activeBtn.parentElement.scrollTo({ left: activeBtn.offsetLeft - 80, behavior: 'smooth' });
        }

        function toggleSettings() {
            const el = document.getElementById('settings-overlay');
            el.classList.toggle('hidden');
            el.classList.toggle('flex');
        }

        function openFullscreen() {
            const overlay = document.getElementById('fullscreen-overlay');
            const img = document.getElementById('fullscreen-image');
            img.src = document.getElementById('main-image').src;
            overlay.classList.add('active');
        }

        function closeFullscreen() {
            document.getElementById('fullscreen-overlay').classList.remove('active');
        }

        init();
    </script>
</body>
</html>
