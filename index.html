<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Golf Yardage</title>
    
    <!-- PWA設定 -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GolfYardage">

    <!-- ホーム画面用アイコン -->
    <link rel="apple-touch-icon" href="icon.png">
    
    <!-- ブラウザタブ用アイコン -->
    <link rel="icon" type="image/png" href="icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { height: 100vh; height: 100dvh; display: flex; flex-direction: column; background-color: #f8fafc; margin: 0; overflow: hidden; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .footer-btn-active { background-color: #059669 !important; color: white !important; border: 1px solid #34d399 !important; }
        .footer-btn-inactive { background-color: #1e293b !important; color: #64748b !important; border: 1px solid transparent !important; }
        .section-badge-active { background-color: #f59e0b !important; color: #000 !important; font-weight: 900; border: 2px solid #fff !important; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4); }
        .glass-card { background: white; border-radius: 1.5rem; border: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); width: 100%; }
        #index-panel { display: none; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; }
        #index-panel.active { display: grid; }
        .kana-btn { background: #fff; border: 1px solid #e2e8f0; border-radius: 0.75rem; font-weight: 800; color: #475569; }
        footer { padding-bottom: calc(0.75rem + env(safe-area-inset-bottom)); }
        #display-course { text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="text-slate-800">

    <!-- プレー画面 -->
    <div id="main-screen" class="flex-1 flex flex-col hidden overflow-hidden bg-slate-950 text-white">
        <header class="bg-slate-800 p-3 flex justify-between items-center border-b border-slate-700 flex-none z-40">
            <div class="flex-1 px-2 overflow-hidden text-left">
                <h1 id="display-course" class="text-xl font-black text-white truncate italic uppercase tracking-tight">COURSE NAME</h1>
            </div>
            <button onclick="showSettings()" class="py-1.5 px-4 bg-emerald-600 rounded-full text-[10px] text-white font-black tracking-widest uppercase active:scale-95 shrink-0">Settings</button>
        </header>
        
        <nav class="bg-slate-900 flex-none border-b border-slate-950 overflow-x-auto no-scrollbar py-3 px-4 flex gap-3" id="hole-tabs"></nav>

        <main class="flex-1 relative flex items-center justify-center overflow-hidden bg-black" onclick="openFullscreen()">
            <img id="main-image" src="" class="max-h-full max-w-full object-contain relative z-10" onerror="handleImgError(this)">
            <div class="absolute top-6 left-6 z-20 bg-slate-900/90 backdrop-blur-xl p-4 rounded-3xl border border-white/20 shadow-2xl">
                <div id="info-hole" class="text-5xl font-black italic leading-none text-white tracking-tighter">H1</div>
                <div id="info-par" class="text-[10px] font-black text-emerald-400 text-center uppercase mt-2 tracking-[0.3em]">PAR -</div>
            </div>
        </main>

        <footer class="bg-slate-900 p-4 flex-none border-t border-slate-800 z-30">
            <div class="flex bg-slate-950 rounded-2xl p-1.5 gap-1.5 max-w-md mx-auto h-16 shadow-inner">
                <button onclick="cycleSection()" id="btn-section-toggle" class="w-24 rounded-xl flex flex-col items-center justify-center active:scale-95 transition-all shrink-0 section-badge-active">
                    <span class="text-[8px] uppercase font-black opacity-60 leading-none mb-1 text-black">Section</span>
                    <span id="section-btn-label" class="text-xs font-black tracking-widest uppercase text-black">OUT</span>
                </button>
                <button onclick="setView('map')" id="btn-map" class="flex-1 rounded-xl font-black text-[10px] footer-btn-active uppercase tracking-widest">Map</button>
                <button onclick="setView('green')" id="btn-green" class="flex-1 rounded-xl font-black text-[10px] footer-btn-inactive uppercase tracking-widest">Green</button>
            </div>
        </footer>
    </div>

    <!-- 設定画面 -->
    <div id="settings-screen" class="fixed inset-0 bg-slate-50 z-[100] p-6 flex flex-col overflow-y-auto">
        <div class="max-w-md mx-auto w-full pt-4 pb-12">
            <!-- アイコン部分を削除し、タイトル周りを調整 -->
            <div class="flex flex-col items-center py-12">
                <h1 class="text-4xl font-black text-slate-800 tracking-tighter italic uppercase text-center">GOLF YARDAGE</h1>
                <div class="text-[10px] font-bold text-slate-400 tracking-[0.5em] uppercase mt-4 border-t border-slate-200 pt-4 w-40 mx-auto text-center">Digital Yardage Book</div>
            </div>

            <div class="glass-card p-6 space-y-6">
                <div class="space-y-3">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] flex items-center gap-2">
                        <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full shadow-[0_0_8px_rgba(16,185,129,0.6)]"></span> Select Course
                    </label>
                    <div class="flex gap-2 w-full min-w-0 overflow-hidden">
                        <button onclick="toggleIndexPanel()" class="w-20 shrink-0 py-4 rounded-xl bg-slate-800 text-white font-black text-sm">Index</button>
                        <div class="flex-1 min-w-0">
                            <select id="course-select" class="w-full h-full py-4 px-3 rounded-xl bg-slate-100 border border-slate-200 text-sm font-bold truncate outline-none"></select>
                        </div>
                    </div>
                    <div id="index-panel" class="pt-2"></div>
                </div>
                <div class="pt-2 flex flex-col gap-3">
                    <button onclick="startRound()" class="w-full py-5 bg-emerald-600 rounded-2xl font-black text-xl text-white shadow-xl shadow-emerald-100 uppercase italic tracking-tight">Start Round</button>
                    <button onclick="resetApp()" class="w-full py-3 bg-white rounded-2xl font-bold text-[10px] text-rose-400 border border-rose-50 uppercase tracking-widest">Reset Data</button>
                </div>
            </div>

            <div class="mt-6 bg-slate-100/50 rounded-3xl p-6 border border-slate-200/50">
                <div class="flex gap-3">
                    <button onclick="loadServerCSV()" class="flex-1 py-3.5 px-2 bg-white rounded-xl text-[10px] font-black text-slate-600 border border-slate-200 uppercase">Load Server</button>
                    <button onclick="document.getElementById('file-input').click()" class="flex-1 py-3.5 px-2 bg-white rounded-xl text-[10px] font-black text-slate-600 border border-slate-200 uppercase">Load Local</button>
                </div>
                <input type="file" id="file-input" accept=".csv" class="hidden" onchange="loadLocalCSV(this)">
                <div id="status-msg" class="text-center text-[9px] text-slate-400 mt-6 font-bold uppercase tracking-[0.1em]">Ready</div>
            </div>
        </div>
    </div>

    <div id="fullscreen-overlay" class="fixed inset-0 bg-black/95 z-[200] hidden items-center justify-center" onclick="this.classList.add('hidden')">
        <img id="fullscreen-image" src="" class="w-full h-full object-contain">
    </div>

    <script>
        // Service Workerの登録
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        let courseData = {};
        let state = { course: "", section: "", hole: 1, view: "map" };
        const kana = ['あ', 'か', 'さ', 'た', 'な', 'は', 'ま', 'や', 'ら', 'わ', '全'];
        function getDisplayName(fullName) { if (!fullName) return ""; return fullName.includes('_') ? fullName.split('_').slice(1).join('_') : fullName; }
        function init() {
            const container = document.getElementById('hole-tabs');
            for(let i=1; i<=9; i++) {
                const btn = document.createElement('button');
                btn.id = `btn-h${i}`; btn.className = `flex-shrink-0 w-12 h-12 rounded-2xl bg-slate-800 font-black text-lg text-slate-500`;
                btn.innerText = i; btn.onclick = () => setHole(i); container.appendChild(btn);
            }
            const panel = document.getElementById('index-panel');
            kana.forEach(char => {
                const b = document.createElement('button'); b.className = "kana-btn py-4 active:bg-emerald-600 active:text-white";
                b.innerText = char; b.onclick = () => filterByKana(char); panel.appendChild(b);
            });
            const saved = localStorage.getItem('golf_db_v18'); if(saved) parseCSV(saved);
        }
        function cycleSection() {
            if(!state.course || !courseData[state.course]) return;
            const sections = Object.keys(courseData[state.course]); if(sections.length <= 1) return;
            state.section = sections[(sections.indexOf(state.section) + 1) % sections.length]; render();
        }
        async function loadServerCSV() { try { const res = await fetch('courses.csv'); processData(await res.text(), "Sync Complete"); } catch(e) { alert("Server Error"); } }
        function loadLocalCSV(input) { const reader = new FileReader(); reader.onload = (e) => processData(e.target.result, "Import Complete"); reader.readAsText(input.files[0]); }
        function processData(text, msg) { if(parseCSV(text)) { localStorage.setItem('golf_db_v18', text); document.getElementById('status-msg').innerText = msg; } }
        function parseCSV(csv) {
            const lines = csv.split(/\r?\n/); courseData = {}; let lastCourse = "";
            lines.forEach(line => {
                const cols = line.split(',').map(c => c.trim());
                if(cols.includes('H1')) { lastCourse = cols[0]; courseData[lastCourse] = {}; }
                else if(lastCourse && cols.length >= 10 && cols[1] !== "") { courseData[lastCourse][cols[0]] = cols.slice(1, 10).map(Number); }
            });
            const names = Object.keys(courseData); if(names.length > 0) updateCourseDropdown(names); return names.length > 0;
        }
        function filterByKana(char) { const all = Object.keys(courseData); updateCourseDropdown((char === '全') ? all : all.filter(n => n.startsWith(char))); toggleIndexPanel(); }
        function updateCourseDropdown(list) {
            const sel = document.getElementById('course-select'); sel.innerHTML = '<option value="">-- Choose Course --</option>' + list.map(c => `<option value="${c}">${getDisplayName(c)}</option>`).join('');
            if(list.length === 1) sel.value = list[0];
        }
        function toggleIndexPanel() { document.getElementById('index-panel').classList.toggle('active'); }
        function startRound() {
            const selected = document.getElementById('course-select').value; if(!selected) return alert("Select course");
            state.course = selected; state.section = Object.keys(courseData[state.course])[0];
            document.getElementById('settings-screen').classList.add('hidden'); document.getElementById('main-screen').classList.remove('hidden'); render();
        }
        function showSettings() { document.getElementById('settings-screen').classList.remove('hidden'); document.getElementById('main-screen').classList.add('hidden'); }
        function setHole(h) { state.hole = h; render(); }
        function setView(v) { state.view = v; render(); }
        function render() {
            document.getElementById('display-course').innerText = getDisplayName(state.course);
            document.getElementById('section-btn-label').innerText = state.section;
            document.getElementById('info-hole').innerText = `H${state.hole}`;
            const pars = (courseData[state.course] && courseData[state.course][state.section]) ? courseData[state.course][state.section] : [];
            document.getElementById('info-par').innerText = `PAR ${pars[state.hole-1] || '-'}`;
            document.getElementById('main-image').src = `img/${state.course}_${state.section}_${state.hole}_${state.view}.jpg`;
            for(let i=1; i<=9; i++) {
                const el = document.getElementById(`btn-h${i}`);
                if(i === state.hole) el.className = "flex-shrink-0 w-12 h-12 rounded-2xl bg-emerald-600 font-black text-lg text-white ring-2 ring-emerald-400 scale-110";
                else el.className = "flex-shrink-0 w-12 h-12 rounded-2xl bg-slate-800 font-black text-lg text-slate-500";
            }
            document.getElementById('btn-map').className = `flex-1 rounded-xl font-black text-[10px] ${state.view==='map' ? 'footer-btn-active' : 'footer-btn-inactive'}`;
            document.getElementById('btn-green').className = `flex-1 rounded-xl font-black text-[10px] ${state.view==='green' ? 'footer-btn-inactive' : 'footer-btn-inactive'}`;
        }
        function handleImgError(el) { el.src = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 600'><rect width='400' height='600' fill='%23020617'/><text x='50%25' y='50%25' fill='%231e293b' font-size='12' text-anchor='middle'>NO IMAGE</text></svg>`; }
        function openFullscreen() { document.getElementById('fullscreen-image').src = document.getElementById('main-image').src; document.getElementById('fullscreen-overlay').classList.remove('hidden'); document.getElementById('fullscreen-overlay').classList.add('flex'); }
        function resetApp() { if(confirm("Reset all data?")) { localStorage.clear(); location.reload(); } }
        init();
    </script>
</body>
</html>
