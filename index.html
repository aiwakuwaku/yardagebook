<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Golf Yardage</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GolfYardage">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <!-- Tailwind CDNを削除し、必要なCSSを直接定義 -->
    <style>
        :root {
            --emerald-400: #34d399;
            --emerald-500: #10b981;
            --emerald-600: #059669;
            --slate-50:  #f8fafc;
            --slate-100: #f1f5f9;
            --slate-200: #e2e8f0;
            --slate-400: #94a3b8;
            --slate-500: #64748b;
            --slate-600: #475569;
            --slate-700: #334155;
            --slate-800: #1e293b;
            --slate-900: #0f172a;
            --slate-950: #020617;
        }

        body { 
            height: 100dvh; display: flex; flex-direction: column; 
            background-color: var(--slate-50); margin: 0; overflow: hidden; 
            font-family: sans-serif; -webkit-tap-highlight-color: transparent;
            color: var(--slate-800);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Utility Classes */
        .flex { display: flex; }
        .flex-1 { flex: 1 1 0%; }
        .flex-col { flex-direction: column; }
        .hidden { display: none; }
        .relative { position: relative; }
        .fixed { position: fixed; }
        .inset-0 { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .overflow-hidden { overflow: hidden; }
        .overflow-x-auto { overflow-x: auto; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .p-1\.5 { padding: 0.375rem; }
        .p-3 { padding: 0.75rem; }
        .p-4 { padding: 1rem; }
        .p-6 { padding: 1.5rem; }
        .gap-1\.5 { gap: 0.375rem; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }

        /* UI Parts */
        .footer-btn-active { background-color: var(--emerald-600) !important; color: white !important; border: 1px solid var(--emerald-400) !important; }
        .footer-btn-inactive { background-color: var(--slate-800) !important; color: var(--slate-500) !important; border: 1px solid transparent !important; }
        .section-badge-active { background-color: #f59e0b !important; color: #000 !important; font-weight: 900; border: 2px solid #fff !important; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4); }
        .glass-card { background: white; border-radius: 1.5rem; border: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); width: 100%; }
        .kana-btn { background: #fff; border: 1px solid var(--slate-200); border-radius: 0.75rem; font-weight: 800; color: var(--slate-600); width: 100%; height: 3.5rem; }
        
        #index-panel { display: none; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; }
        #index-panel.active { display: grid; }
        
        footer { padding-bottom: calc(0.75rem + env(safe-area-inset-bottom)); }

        .btn-emerald { background-color: var(--emerald-600); color: white; border-radius: 1rem; font-weight: 900; border: none; }
        .btn-slate-800 { background-color: var(--slate-800); color: white; border-radius: 1rem; border: none; }
    </style>
</head>
<body>

    <!-- プレー画面 -->
    <div id="main-screen" class="flex-1 flex flex-col hidden overflow-hidden" style="background-color: var(--slate-950); color: white;">
        <header style="background-color: var(--slate-800); padding: 0.75rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--slate-700);">
            <div style="flex: 1; overflow: hidden;">
                <h1 id="display-course" style="font-size: 1.25rem; font-weight: 900; font-style: italic; text-transform: uppercase; margin: 0; white-space: nowrap; text-overflow: ellipsis;">COURSE NAME</h1>
            </div>
            <button onclick="showSettings()" class="btn-emerald" style="padding: 0.4rem 1rem; font-size: 10px; text-transform: uppercase;">Settings</button>
        </header>
        
        <nav id="hole-tabs" class="overflow-x-auto no-scrollbar" style="background-color: var(--slate-900); padding: 0.75rem 1rem; display: flex; gap: 0.75rem; border-bottom: 1px solid black;"></nav>

        <main class="flex-1 relative flex items-center justify-center" style="background: black;" onclick="openFullscreen()">
            <img id="main-image" src="" style="max-height: 100%; max-width: 100%; object-fit: contain; position: relative; z-index: 10;" onerror="handleImgError(this)">
            <div style="position: absolute; top: 1.5rem; left: 1.5rem; z-index: 20; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); padding: 1rem; border-radius: 1.5rem; border: 1px solid rgba(255,255,255,0.2);">
                <div id="info-hole" style="font-size: 3rem; font-weight: 900; font-style: italic; line-height: 1;">H1</div>
                <div id="info-par" style="font-size: 10px; font-weight: 900; color: var(--emerald-400); text-align: center; margin-top: 0.5rem; letter-spacing: 0.3em;">PAR -</div>
            </div>
        </main>

        <footer style="background-color: var(--slate-900); padding: 1rem; border-top: 1px solid var(--slate-800);">
            <div class="flex p-1.5 gap-1.5" style="background-color: var(--slate-950); border-radius: 1.25rem; max-width: 28rem; margin: 0 auto; height: 4rem;">
                <button onclick="cycleSection()" id="btn-section-toggle" class="section-badge-active" style="width: 6rem; border-radius: 0.75rem; display: flex; flex-direction: column; align-items: center; justify-content: center; border: none;">
                    <span style="font-size: 8px; font-weight: 900; opacity: 0.6; text-transform: uppercase; color: black;">Section</span>
                    <span id="section-btn-label" style="font-size: 0.75rem; font-weight: 900; text-transform: uppercase; color: black;">OUT</span>
                </button>
                <button onclick="setView('map')" id="btn-map" class="flex-1" style="border-radius: 0.75rem; font-weight: 900; font-size: 10px; text-transform: uppercase;">Map</button>
                <button onclick="setView('green')" id="btn-green" class="flex-1" style="border-radius: 0.75rem; font-weight: 900; font-size: 10px; text-transform: uppercase;">Green</button>
            </div>
        </footer>
    </div>

    <!-- 設定画面 -->
    <div id="settings-screen" class="fixed inset-0 p-6 flex flex-col overflow-y-auto" style="background-color: var(--slate-50); z-index: 100;">
        <div style="max-width: 28rem; margin: 0 auto; width: 100%; padding: 1rem 0 3rem 0;">
            <div class="flex flex-col items-center" style="padding: 3rem 0;">
                <h1 style="font-size: 2.25rem; font-weight: 900; font-style: italic; text-transform: uppercase; margin: 0; letter-spacing: -0.05em;">GOLF YARDAGE</h1>
                <div style="font-size: 10px; font-weight: 900; color: var(--slate-400); letter-spacing: 0.5em; text-transform: uppercase; margin-top: 1rem; border-top: 1px solid var(--slate-200); padding-top: 1rem; width: 10rem; text-align: center;">Digital Yardage Book</div>
            </div>

            <div class="glass-card p-6" style="display: flex; flex-direction: column; gap: 1.5rem;">
                <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                    <label style="font-size: 10px; font-weight: 900; color: var(--slate-400); text-transform: uppercase; letter-spacing: 0.2em; display: flex; align-items: center; gap: 0.5rem;">
                        <span style="width: 6px; height: 6px; background: var(--emerald-500); border-radius: 50%;"></span> Select Course
                    </label>
                    <div class="flex gap-2">
                        <button onclick="toggleIndexPanel()" class="btn-slate-800" style="width: 5rem; height: 3.5rem; font-weight: 900;">Index</button>
                        <div class="flex-1">
                            <select id="course-select" style="width: 100%; height: 3.5rem; padding: 0 1rem; border-radius: 0.75rem; background: var(--slate-100); border: 1px solid var(--slate-200); font-weight: 700; font-size: 0.875rem;"></select>
                        </div>
                    </div>
                    <div id="index-panel"></div>
                </div>
                <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                    <button onclick="startRound()" class="btn-emerald" style="width: 100%; padding: 1.25rem 0; font-size: 1.25rem; font-style: italic;">Start Round</button>
                    <button onclick="resetApp()" style="width: 100%; padding: 0.75rem 0; background: white; border-radius: 1rem; border: 1px solid #fee2e2; color: #fb7185; font-size: 10px; font-weight: 700; text-transform: uppercase;">Reset Data</button>
                </div>
            </div>

            <div style="margin-top: 1.5rem; background: rgba(241, 245, 249, 0.5); border-radius: 1.5rem; padding: 1.5rem; border: 1px solid rgba(226, 232, 240, 0.5);">
                <div class="flex gap-3">
                    <button onclick="loadServerCSV()" style="flex: 1; padding: 0.8rem; background: white; border: 1px solid var(--slate-200); border-radius: 0.75rem; font-size: 10px; font-weight: 900; color: var(--slate-600);">Load Server</button>
                    <button onclick="document.getElementById('file-input').click()" style="flex: 1; padding: 0.8rem; background: white; border: 1px solid var(--slate-200); border-radius: 0.75rem; font-size: 10px; font-weight: 900; color: var(--slate-600);">Load Local</button>
                </div>
                <input type="file" id="file-input" accept=".csv" class="hidden" onchange="loadLocalCSV(this)">
                <div id="status-msg" style="text-align: center; font-size: 9px; color: var(--slate-400); margin-top: 1.5rem; font-weight: 700; text-transform: uppercase;">Ready</div>
            </div>
        </div>
    </div>

    <div id="fullscreen-overlay" class="fixed inset-0 hidden items-center justify-center" style="background: rgba(0,0,0,0.95); z-index: 200;" onclick="this.classList.add('hidden')">
        <img id="fullscreen-image" src="" style="width: 100%; height: 100%; object-fit: contain;">
    </div>

    <script>
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

        let courseData = {};
        let state = { course: "", section: "", hole: 1, view: "map" };
        const kana = ['あ', 'か', 'さ', 'た', 'な', 'は', 'ま', 'や', 'ら', 'わ', '全'];

        function getDisplayName(fullName) { if (!fullName) return ""; return fullName.includes('_') ? fullName.split('_').slice(1).join('_') : fullName; }
        
        function init() {
            const container = document.getElementById('hole-tabs');
            for(let i=1; i<=9; i++) {
                const btn = document.createElement('button');
                btn.id = `btn-h${i}`;
                btn.style = "flex-shrink: 0; width: 3rem; height: 3rem; border-radius: 1rem; border: none; font-weight: 900; font-size: 1.125rem;";
                btn.innerText = i; btn.onclick = () => setHole(i); container.appendChild(btn);
            }
            const panel = document.getElementById('index-panel');
            kana.forEach(char => {
                const b = document.createElement('button'); b.className = "kana-btn";
                b.innerText = char; b.onclick = () => filterByKana(char); panel.appendChild(b);
            });
            const saved = localStorage.getItem('golf_db_v18'); if(saved) parseCSV(saved);
        }

        function cycleSection() {
            if(!state.course || !courseData[state.course]) return;
            const sections = Object.keys(courseData[state.course]); if(sections.length <= 1) return;
            state.section = sections[(sections.indexOf(state.section) + 1) % sections.length]; render();
        }

        async function loadServerCSV() { try { const res = await fetch('courses.csv'); processData(await res.text(), "Sync Complete"); } catch(e) { alert("Server Error"); } }
        function loadLocalCSV(input) { const reader = new FileReader(); reader.onload = (e) => processData(e.target.result, "Import Complete"); reader.readAsText(input.files[0]); }
        function processData(text, msg) { if(parseCSV(text)) { localStorage.setItem('golf_db_v18', text); document.getElementById('status-msg').innerText = msg; } }

        function parseCSV(csv) {
            const lines = csv.split(/\r?\n/); courseData = {}; let lastCourse = "";
            lines.forEach(line => {
                const cols = line.split(',').map(c => c.trim());
                if(cols.includes('H1')) { lastCourse = cols[0]; courseData[lastCourse] = {}; }
                else if(lastCourse && cols.length >= 10 && cols[1] !== "") { courseData[lastCourse][cols[0]] = cols.slice(1, 10).map(Number); }
            });
            const names = Object.keys(courseData); if(names.length > 0) updateCourseDropdown(names); return names.length > 0;
        }

        function filterByKana(char) { const all = Object.keys(courseData); updateCourseDropdown((char === '全') ? all : all.filter(n => n.startsWith(char))); toggleIndexPanel(); }
        function updateCourseDropdown(list) {
            const sel = document.getElementById('course-select'); sel.innerHTML = '<option value="">-- Choose Course --</option>' + list.map(c => `<option value="${c}">${getDisplayName(c)}</option>`).join('');
            if(list.length === 1) sel.value = list[0];
        }

        function toggleIndexPanel() { document.getElementById('index-panel').classList.toggle('active'); }
        function startRound() {
            const selected = document.getElementById('course-select').value; if(!selected) return alert("Select course");
            state.course = selected; state.section = Object.keys(courseData[state.course])[0];
            document.getElementById('settings-screen').classList.add('hidden'); document.getElementById('main-screen').classList.remove('hidden'); render();
        }

        function showSettings() { document.getElementById('settings-screen').classList.remove('hidden'); document.getElementById('main-screen').classList.add('hidden'); }
        function setHole(h) { state.hole = h; render(); }
        function setView(v) { state.view = v; render(); }

        function render() {
            document.getElementById('display-course').innerText = getDisplayName(state.course);
            document.getElementById('section-btn-label').innerText = state.section;
            document.getElementById('info-hole').innerText = `H${state.hole}`;
            const pars = (courseData[state.course] && courseData[state.course][state.section]) ? courseData[state.course][state.section] : [];
            document.getElementById('info-par').innerText = `PAR ${pars[state.hole-1] || '-'}`;
            document.getElementById('main-image').src = `img/${state.course}_${state.section}_${state.hole}_${state.view}.jpg`;
            
            for(let i=1; i<=9; i++) {
                const el = document.getElementById(`btn-h${i}`);
                if(i === state.hole) {
                    el.style.backgroundColor = "var(--emerald-600)"; el.style.color = "white";
                    el.style.boxShadow = "0 0 0 2px var(--emerald-400)"; el.style.transform = "scale(1.1)";
                } else {
                    el.style.backgroundColor = "var(--slate-800)"; el.style.color = "var(--slate-500)";
                    el.style.boxShadow = "none"; el.style.transform = "scale(1)";
                }
            }

            document.getElementById('btn-map').className = `flex-1 ${state.view === 'map' ? 'footer-btn-active' : 'footer-btn-inactive'}`;
            document.getElementById('btn-green').className = `flex-1 ${state.view === 'green' ? 'footer-btn-active' : 'footer-btn-inactive'}`;
        }

        function handleImgError(el) { el.src = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 600'><rect width='400' height='600' fill='%23020617'/><text x='50%25' y='50%25' fill='%231e293b' font-size='12' text-anchor='middle'>NO IMAGE</text></svg>`; }
        function openFullscreen() { document.getElementById('fullscreen-image').src = document.getElementById('main-image').src; document.getElementById('fullscreen-overlay').classList.remove('hidden'); document.getElementById('fullscreen-overlay').style.display = 'flex'; }
        function resetApp() { if(confirm("Reset all data?")) { localStorage.clear(); location.reload(); } }
        
        init();
    </script>
</body>
</html>
