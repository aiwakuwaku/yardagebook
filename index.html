<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Golf Yardage</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <style>
        :root {
            --emerald: #059669;
            --slate-800: #1e293b;
            --slate-900: #0f172a;
            --slate-950: #020617;
        }

        /* 根本的なスクロール・クリック阻害の防止 */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        html, body { 
            height: 100%; width: 100%; margin: 0; padding: 0; 
            overflow: hidden; background: var(--slate-950);
            font-family: sans-serif; position: fixed; /* 画面全体のバウンス防止 */
        }

        /* 垂直レイアウトの固定 */
        .app-container {
            display: flex; flex-direction: column; height: 100vh; height: 100dvh; width: 100%;
        }

        /* ヘッダー: 60px */
        header { 
            height: 60px; background: var(--slate-800); display: flex; 
            align-items: center; justify-content: space-between; padding: 0 15px;
            border-bottom: 1px solid #334155; z-index: 100; flex-shrink: 0;
        }

        /* ホールナビ: 70px (確実にスクロールさせる設定) */
        .hole-nav {
            height: 70px; background: var(--slate-900); display: flex; 
            align-items: center; padding: 0 10px; overflow-x: scroll; 
            overflow-y: hidden; -webkit-overflow-scrolling: touch; 
            border-bottom: 2px solid #000; z-index: 100; flex-shrink: 0;
        }
        .hole-nav::-webkit-scrollbar { display: none; }
        
        .hole-btn {
            min-width: 50px; width: 50px; height: 50px; margin: 0 6px;
            border-radius: 12px; border: none; font-size: 20px; font-weight: 900;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            cursor: pointer; transition: 0.2s;
        }
        .h-active { background: var(--emerald); color: white; transform: scale(1.05); box-shadow: 0 0 15px rgba(16,185,129,0.4); }
        .h-inactive { background: var(--slate-800); color: #64748b; }

        /* メインエリア: 残りの高さ */
        main { 
            flex: 1; background: #000; position: relative; 
            display: flex; align-items: center; justify-content: center; 
            overflow: hidden; z-index: 10;
        }
        #main-image { max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: auto; }

        /* ホール情報の浮きパネル (クリックを邪魔しないように設定) */
        .info-panel {
            position: absolute; top: 15px; left: 15px; background: rgba(15, 23, 42, 0.9);
            padding: 12px 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
            color: white; pointer-events: none; z-index: 20;
        }

        /* フッター: 110px (余裕を持たせる) */
        footer { 
            height: 110px; background: var(--slate-900); display: flex; 
            align-items: center; justify-content: center; 
            padding-bottom: env(safe-area-inset-bottom); border-top: 1px solid #1e293b;
            z-index: 100; flex-shrink: 0;
        }
        .ctrl-bar {
            background: var(--slate-950); width: 92%; max-width: 420px; height: 65px;
            border-radius: 20px; display: flex; padding: 6px; gap: 6px;
        }
        .f-btn { 
            flex: 1; border-radius: 14px; border: none; font-weight: 900; 
            font-size: 12px; cursor: pointer; transition: 0.2s;
        }
        .f-active { background: var(--emerald); color: white; }
        .f-inactive { background: var(--slate-800); color: #475569; }
        
        .sec-btn {
            width: 100px; background: #f59e0b; color: #000; border-radius: 14px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 2px solid #fff; font-weight: 900; cursor: pointer;
        }

        /* 設定画面 */
        #settings-screen {
            position: fixed; inset: 0; background: #f8fafc; z-index: 2000;
            padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center;
        }
        .card { 
            background: white; border-radius: 24px; border: 1px solid #e2e8f0;
            padding: 25px; width: 100%; max-width: 400px; box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .kana-grid { display: none; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 15px; }
        .kana-grid.active { display: grid; }
        .k-btn { height: 50px; border-radius: 12px; border: 1px solid #e2e8f0; background: white; font-weight: 800; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="app" class="app-container">
        <!-- プレー画面 -->
        <div id="main-screen" class="app-container hidden">
            <header>
                <div id="display-course" style="color:white; font-weight:900; font-style:italic; text-transform:uppercase; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; margin-right:10px;">COURSE</div>
                <button onclick="openSettings()" style="background:var(--emerald); color:white; border:none; padding:8px 12px; border-radius:20px; font-weight:900; font-size:10px; flex-shrink:0;">SETTINGS</button>
            </header>
            
            <div id="hole-tabs" class="hole-nav"></div>

            <main onclick="toggleFullscreen()">
                <img id="main-image" src="" onerror="handleImgError(this)">
                <div class="info-panel">
                    <div id="info-hole" style="font-size: 36px; font-weight: 900; font-style: italic; line-height: 1;">H1</div>
                    <div id="info-par" style="font-size: 10px; font-weight: 900; color: #34d399; text-align: center; margin-top: 4px;">PAR -</div>
                </div>
            </main>

            <footer>
                <div class="ctrl-bar">
                    <button onclick="changeSection()" id="btn-sec" class="sec-btn">
                        <span style="font-size: 8px; opacity: 0.8;">SECTION</span>
                        <span id="label-sec">OUT</span>
                    </button>
                    <button onclick="changeView('map')" id="btn-map" class="f-btn">MAP</button>
                    <button onclick="changeView('green')" id="btn-green" class="f-btn">GREEN</button>
                </div>
            </footer>
        </div>

        <!-- 設定画面 -->
        <div id="settings-screen">
            <div style="text-align: center; margin: 40px 0;">
                <h1 style="font-size: 30px; font-weight: 900; font-style: italic; margin: 0; color: #1e293b;">GOLF YARDAGE</h1>
                <p style="font-size: 10px; color: #94a3b8; letter-spacing: 5px; margin-top: 10px; border-top: 1px solid #ddd; padding-top: 10px;">DIGITAL YARDAGE BOOK</p>
            </div>

            <div class="card">
                <label style="font-size: 10px; font-weight: 900; color: #94a3b8; display: block; margin-bottom: 10px;">SELECT COURSE</label>
                <div style="display: flex; gap: 8px; margin-bottom: 15px;">
                    <button onclick="document.getElementById('k-grid').classList.toggle('active')" style="background: #1e293b; color: white; border: none; padding: 15px; border-radius: 12px; font-weight: 900; width: 80px;">INDEX</button>
                    <select id="course-select" style="flex: 1; padding: 15px; border-radius: 12px; background: #f1f5f9; border: 1px solid #e2e8f0; font-weight: 700; font-size: 14px;"></select>
                </div>
                <div id="k-grid" class="kana-grid"></div>

                <button onclick="startRound()" style="width: 100%; background: var(--emerald); color: white; border: none; padding: 20px; border-radius: 15px; font-size: 20px; font-weight: 900; font-style: italic; margin-top: 10px;">START ROUND</button>
                <button onclick="resetData()" style="width: 100%; background: none; color: #fb7185; border: none; padding: 15px; font-size: 10px; font-weight: 700; margin-top: 10px;">RESET ALL DATA</button>
            </div>

            <div style="margin-top: 20px; width: 100%; max-width: 400px; display: flex; gap: 10px;">
                <button onclick="loadSrv()" style="flex: 1; padding: 12px; background: white; border: 1px solid #ddd; border-radius: 12px; font-size: 10px; font-weight: 900;">LOAD SERVER</button>
                <button onclick="document.getElementById('f-in').click()" style="flex: 1; padding: 12px; background: white; border: 1px solid #ddd; border-radius: 12px; font-size: 10px; font-weight: 900;">LOAD LOCAL</button>
            </div>
            <input type="file" id="f-in" accept=".csv" class="hidden" onchange="loadLoc(this)">
            <p id="msg" style="font-size: 9px; color: #94a3b8; margin-top: 15px; font-weight: 700;">READY</p>
        </div>
    </div>

    <!-- 全画面用オーバーレイ -->
    <div id="fs-overlay" class="hidden" style="position:fixed; inset:0; background:rgba(0,0,0,0.98); z-index:3000; display:flex; align-items:center; justify-content:center;" onclick="this.classList.add('hidden')">
        <img id="fs-img" src="" style="width: 100%; height: 100%; object-fit: contain;">
    </div>

    <script>
        // --- データ保持 ---
        let db = {};
        let st = { course: "", sec: "", hole: 1, view: "map" };

        // --- 初期化 ---
        window.addEventListener('DOMContentLoaded', () => {
            if ('serviceWorker' in navigator) { 
                navigator.serviceWorker.register('sw.js?v=2').then(reg => {
                    reg.onupdatefound = () => {
                        const installingWorker = reg.installing;
                        installingWorker.onstatechange = () => {
                            if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                location.reload(); // 更新があったら自動リロード
                            }
                        };
                    };
                });
            }
            
            // ホールボタン
            const tabs = document.getElementById('hole-tabs');
            for(let i=1; i<=9; i++) {
                const b = document.createElement('button');
                b.className = "hole-btn h-inactive";
                b.id = `hbtn-${i}`;
                b.innerText = i;
                b.onclick = (e) => { e.preventDefault(); e.stopPropagation(); clickHole(i); };
                tabs.appendChild(b);
            }

            // 50音
            const kana = ['あ', 'か', 'さ', 'た', 'な', 'は', 'ま', 'や', 'ら', 'わ', '全'];
            const grid = document.getElementById('k-grid');
            kana.forEach(k => {
                const b = document.createElement('button');
                b.className = "k-btn";
                b.innerText = k;
                b.onclick = () => filterKana(k);
                grid.appendChild(b);
            });

            const saved = localStorage.getItem('golf_db_v18');
            if(saved) parse(saved);
        });

        // --- ロジック ---
        function parse(csv) {
            const lines = csv.split(/\r?\n/);
            db = {}; let cur = "";
            lines.forEach(l => {
                if(!l.trim()) return;
                const c = l.split(',').map(s => s.trim());
                if(c.includes('H1')) { cur = c[0]; db[cur] = {}; }
                else if(cur && c.length >= 10 && c[1] !== "") { db[cur][c[0]] = c.slice(1, 10).map(Number); }
            });
            const names = Object.keys(db);
            if(names.length > 0) buildSelect(names);
        }

        function buildSelect(list) {
            const s = document.getElementById('course-select');
            s.innerHTML = '<option value="">-- CHOOSE --</option>' + 
                list.map(n => `<option value="${n}">${n.includes('_') ? n.split('_').slice(1).join('_') : n}</option>`).join('');
        }

        function filterKana(k) {
            const all = Object.keys(db);
            buildSelect(k === '全' ? all : all.filter(n => n.startsWith(k)));
            document.getElementById('k-grid').classList.remove('active');
        }

        function startRound() {
            const c = document.getElementById('course-select').value;
            if(!c) return alert("Select course");
            st.course = c;
            st.sec = Object.keys(db[c])[0];
            st.hole = 1; st.view = "map";
            document.getElementById('settings-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            ui();
        }

        function openSettings() {
            document.getElementById('settings-screen').classList.remove('hidden');
            document.getElementById('main-screen').classList.add('hidden');
        }

        function clickHole(n) { st.hole = n; ui(); }
        function changeView(v) { st.view = v; ui(); }
        function changeSection() {
            const secs = Object.keys(db[st.course]);
            if(secs.length <= 1) return;
            st.sec = secs[(secs.indexOf(st.sec) + 1) % secs.length];
            ui();
        }

        // --- UI更新 (描画を一本化) ---
        function ui() {
            console.log("Rendering UI:", st); // デバッグ用ログ
            
            document.getElementById('display-course').innerText = st.course.includes('_') ? st.course.split('_').slice(1).join('_') : st.course;
            document.getElementById('label-sec').innerText = st.sec;
            document.getElementById('info-hole').innerText = `H${st.hole}`;
            
            const pars = db[st.course][st.sec] || [];
            document.getElementById('info-par').innerText = `PAR ${pars[st.hole-1] || '-'}`;
            
            // 画像
            document.getElementById('main-image').src = `img/${st.course}_${st.sec}_${st.hole}_${st.view}.jpg?v=${new Date().getTime()}`;
            
            // ボタン色
            for(let i=1; i<=9; i++) {
                const b = document.getElementById(`hbtn-${i}`);
                b.className = (i === st.hole) ? "hole-btn h-active" : "hole-btn h-inactive";
            }
            document.getElementById('btn-map').className = `f-btn ${st.view === 'map' ? 'f-active' : 'f-inactive'}`;
            document.getElementById('btn-green').className = `f-btn ${st.view === 'green' ? 'f-active' : 'f-inactive'}`;
        }

        // --- その他 ---
        async function loadSrv() { 
            try { 
                const res = await fetch('courses.csv');
                const txt = await res.text();
                parse(txt); localStorage.setItem('golf_db_v18', txt);
                document.getElementById('msg').innerText = "LOADED FROM SERVER";
            } catch(e) { alert("Load Failed"); } 
        }
        function loadLoc(i) {
            const r = new FileReader();
            r.onload = (e) => { parse(e.target.result); localStorage.setItem('golf_db_v18', e.target.result); document.getElementById('msg').innerText = "LOADED LOCAL"; };
            r.readAsText(i.files[0]);
        }
        function handleImgError(el) { el.src = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 600'><rect width='400' height='600' fill='%23020617'/><text x='50%25' y='50%25' fill='%231e293b' font-size='16' text-anchor='middle' font-weight='900'>NO IMAGE</text></svg>`; }
        function toggleFullscreen() { 
            const img = document.getElementById('main-image').src;
            if(img.startsWith('data:')) return;
            document.getElementById('fs-img').src = img;
            document.getElementById('fs-overlay').classList.remove('hidden');
        }
        function resetData() { if(confirm("Clear All?")) { localStorage.clear(); location.reload(); } }
    </script>
</body>
</html>
