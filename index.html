<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Golf Yardage PWA</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            height: 100vh; height: 100dvh; 
            display: flex; flex-direction: column; 
            background-color: #f8fafc; margin: 0; overflow: hidden; 
            font-family: 'Helvetica Neue', Arial, sans-serif; -webkit-tap-highlight-color: transparent; 
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* プレー画面用 */
        .footer-btn-active { background-color: #059669 !important; color: white !important; border: 1px solid #34d399 !important; }
        .footer-btn-inactive { background-color: #1e293b !important; color: #64748b !important; border: 1px solid transparent !important; }
        .section-badge-active { background-color: #f59e0b !important; color: #000 !important; font-weight: 900; border: 2px solid #fff !important; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4); }

        /* 設定画面：洗練されたパーツ */
        .glass-card { background: white; border-radius: 1.5rem; border: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); }
        .input-elegant { background-color: #f1f5f9; border: 1px solid #e2e8f0; transition: all 0.2s; }
        .input-elegant:focus { border-color: #10b981; background-color: white; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1); }
        
        #index-panel { display: none; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; }
        #index-panel.active { display: grid; }

        .kana-btn { background: #fff; border: 1px solid #e2e8f0; border-radius: 0.75rem; font-weight: 800; color: #475569; transition: all 0.2s; }
        .kana-btn:active { background: #10b981; color: white; border-color: #10b981; transform: scale(0.9); }

        footer { padding-bottom: calc(0.75rem + env(safe-area-inset-bottom)); }
    </style>
</head>
<body class="text-slate-800">

    <!-- プレー画面 (ロジックは不変) -->
    <div id="main-screen" class="flex-1 flex flex-col hidden overflow-hidden bg-slate-950 text-white">
        <header class="bg-slate-900/80 backdrop-blur-md p-3 flex justify-between items-center border-b border-slate-800 flex-none z-40">
            <div class="flex-1 px-2 overflow-hidden text-left">
                <h1 id="display-course" class="text-xs text-slate-500 truncate uppercase tracking-[0.2em] font-black">Course</h1>
            </div>
            <button onclick="showSettings()" class="py-1.5 px-4 bg-slate-800 rounded-full text-[10px] border border-slate-700 text-slate-300 font-black tracking-widest uppercase active:scale-95 transition-transform">Settings</button>
        </header>
        
        <nav class="bg-slate-900 flex-none border-b border-slate-950 overflow-x-auto no-scrollbar py-3 px-4 flex gap-3" id="hole-tabs"></nav>

        <main class="flex-1 relative flex items-center justify-center overflow-hidden bg-black" onclick="openFullscreen()">
            <img id="main-image" src="" class="max-h-full max-w-full object-contain relative z-10" onerror="handleImgError(this)">
            <div class="absolute top-6 left-6 z-20 bg-slate-900/80 backdrop-blur-xl p-4 rounded-3xl border border-white/10 shadow-2xl">
                <div id="info-hole" class="text-5xl font-black italic leading-none text-white tracking-tighter">H1</div>
                <div id="info-par" class="text-[10px] font-black text-emerald-400 text-center uppercase mt-2 tracking-[0.3em]">PAR -</div>
            </div>
        </main>

        <footer class="bg-slate-900 p-4 flex-none border-t border-slate-800 z-30">
            <div class="flex bg-slate-950 rounded-2xl p-1.5 gap-1.5 max-w-md mx-auto h-16">
                <button onclick="cycleSection()" id="btn-section-toggle" class="w-24 rounded-xl flex flex-col items-center justify-center active:scale-95 transition-all shrink-0 section-badge-active">
                    <span class="text-[7px] uppercase font-black opacity-60 leading-none mb-1 tracking-tighter">Section</span>
                    <span id="section-btn-label" class="text-xs font-black tracking-widest uppercase">OUT</span>
                </button>
                <button onclick="setView('map')" id="btn-map" class="flex-1 rounded-xl font-black text-[10px] transition-all footer-btn-active uppercase tracking-widest">Map</button>
                <button onclick="setView('green')" id="btn-green" class="flex-1 rounded-xl font-black text-[10px] transition-all footer-btn-inactive uppercase tracking-widest">Green</button>
            </div>
        </footer>
    </div>

    <!-- 設定画面 (デザイン洗練版) -->
    <div id="settings-screen" class="fixed inset-0 bg-slate-50 z-[100] p-6 flex flex-col overflow-y-auto">
        <div class="max-w-md mx-auto w-full pt-4 pb-12">
            
            <!-- ロゴセクション -->
            <div class="flex flex-col items-center py-8">
                <div class="relative">
                    <div class="absolute inset-0 bg-emerald-500 blur-2xl opacity-20 rounded-full"></div>
                    <svg class="relative w-12 h-12 text-emerald-600" fill="currentColor" viewBox="0 0 24 24"><path d="M19.32,15C17.79,15.15 16.42,15.7 15.28,16.5L10.21,11.43C10.72,10.5 11,9.33 11,8C11,4.13 7.87,1 4,1C3.45,1 3,1.45 3,2C3,2.55 3.45,3 4,3C6.76,3 9,5.24 9,8C9,10.76 6.76,13 4,13C3.45,13 3,13.45 3,14C3,14.55 3.45,15 4,15C5.33,15 6.5,14.72 7.57,14.21L12.64,19.28C11.84,20.42 11.29,21.79 11.14,23.32C11.11,23.71 11.41,24 11.8,24H12.2C12.55,24 12.85,23.73 12.88,23.38C13.15,20.25 15.75,17.65 18.88,17.38C19.23,17.35 19.5,17.05 19.5,16.7V16.3C19.5,15.91 19.21,15.61 18.82,15.58C18.91,15.58 19.11,15.54 19.32,15Z"/></svg>
                </div>
                <h1 class="text-3xl font-black text-slate-800 tracking-tighter italic uppercase mt-4">GOLF YARDAGE</h1>
                <div class="text-[9px] font-bold text-slate-400 tracking-[0.5em] uppercase mt-2 border-t border-slate-200 pt-2 w-32 text-center">Digital Yardage Book</div>
            </div>

            <!-- メインフォーム：カード形式 -->
            <div class="glass-card p-6 space-y-6">
                <!-- コース選択 -->
                <div class="space-y-3">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] flex items-center gap-2">
                        <span class="w-1 h-1 bg-emerald-500 rounded-full"></span> Select Course
                    </label>
                    <div class="flex gap-2">
                        <button onclick="toggleIndexPanel()" class="w-20 py-4 rounded-xl bg-slate-800 text-white font-black text-sm shadow-lg active:scale-95 transition-transform">Index</button>
                        <select id="course-select" class="flex-1 py-4 px-4 rounded-xl input-elegant text-sm font-bold truncate appearance-none"></select>
                    </div>
                    
                    <div id="index-panel" class="pt-2"></div>
                    
                    <div class="relative flex items-center py-2">
                        <div class="flex-grow border-t border-slate-100"></div>
                        <span class="flex-shrink mx-4 text-[10px] font-bold text-slate-300 uppercase tracking-widest">or</span>
                        <div class="flex-grow border-t border-slate-100"></div>
                    </div>
                    
                    <input type="text" id="manual-course" placeholder="Input Course Name manually" class="w-full py-4 px-5 rounded-xl input-elegant text-sm font-bold">
                </div>

                <!-- アクションボタン -->
                <div class="pt-4 flex flex-col gap-3">
                    <button onclick="startRound()" class="w-full py-5 bg-emerald-600 rounded-2xl font-black text-xl text-white shadow-xl shadow-emerald-200 active:scale-[0.98] active:bg-emerald-700 transition-all uppercase italic tracking-tight">
                        Start Round
                    </button>
                    <button onclick="resetApp()" class="w-full py-3 bg-white rounded-2xl font-bold text-xs text-rose-500 border border-rose-100 active:bg-rose-50 transition-colors uppercase tracking-widest">
                        Reset Data
                    </button>
                </div>
            </div>

            <!-- データソース：サブカード -->
            <div class="mt-6 bg-slate-100/50 rounded-3xl p-6 border border-slate-200/50">
                <label class="text-[10px] font-black text-slate-400 mb-4 block uppercase tracking-[0.2em] text-center">Data Management</label>
                <div class="flex gap-3">
                    <button onclick="loadServerCSV()" class="flex-1 py-3.5 px-2 bg-white rounded-xl text-[10px] font-black text-slate-600 border border-slate-200 shadow-sm active:bg-slate-50 uppercase tracking-tighter transition-all">
                        Load Server
                    </button>
                    <button onclick="document.getElementById('file-input').click()" class="flex-1 py-3.5 px-2 bg-white rounded-xl text-[10px] font-black text-slate-600 border border-slate-200 shadow-sm active:bg-slate-50 uppercase tracking-tighter transition-all">
                        Load Local
                    </button>
                </div>
                <input type="file" id="file-input" accept=".csv" class="hidden" onchange="loadLocalCSV(this)">
                <div id="status-msg" class="text-center text-[9px] text-slate-400 mt-6 font-bold uppercase tracking-[0.1em] opacity-60">Ready to sync</div>
            </div>

        </div>
    </div>

    <!-- フルスクリーン (変更なし) -->
    <div id="fullscreen-overlay" class="fixed inset-0 bg-black/95 backdrop-blur-xl z-[200] hidden items-center justify-center" onclick="this.classList.add('hidden')">
        <img id="fullscreen-image" src="" class="w-full h-full object-contain">
    </div>

    <script>
        // ロジック部分は「ゴルフのコース検索機能」を維持したままアップデート
        let courseData = {};
        let state = { course: "", section: "", hole: 1, view: "map" };
        const kana = ['あ', 'か', 'さ', 'た', 'な', 'は', 'ま', 'や', 'ら', 'わ', '全'];

        function getDisplayName(fullName) {
            if (!fullName) return "";
            return fullName.includes('_') ? fullName.split('_').slice(1).join('_') : fullName;
        }

        function init() {
            const container = document.getElementById('hole-tabs');
            for(let i=1; i<=9; i++) {
                const btn = document.createElement('button');
                btn.id = `btn-h${i}`;
                btn.className = `flex-shrink-0 w-12 h-12 rounded-2xl bg-slate-800 font-black text-lg text-slate-400 transition-all active:scale-90`;
                btn.innerText = i;
                btn.onclick = () => setHole(i);
                container.appendChild(btn);
            }
            const panel = document.getElementById('index-panel');
            kana.forEach(char => {
                const b = document.createElement('button');
                b.className = "kana-btn py-4";
                b.innerText = char;
                b.onclick = () => filterByKana(char);
                panel.appendChild(b);
            });
            const saved = localStorage.getItem('golf_db_v14');
            if(saved) parseCSV(saved);
        }

        function cycleSection() {
            if(!state.course || !courseData[state.course]) return;
            const sections = Object.keys(courseData[state.course]);
            if(sections.length <= 1) return;
            state.section = sections[(sections.indexOf(state.section) + 1) % sections.length];
            render();
        }

        async function loadServerCSV() {
            try {
                const res = await fetch('courses.csv');
                processData(await res.text(), "Server Sync Complete");
            } catch(e) { alert("Server Connection Failed"); }
        }

        function loadLocalCSV(input) {
            const reader = new FileReader();
            reader.onload = (e) => processData(e.target.result, "Local Import Complete");
            reader.readAsText(input.files[0]);
        }

        function processData(text, msg) {
            if(parseCSV(text)) {
                localStorage.setItem('golf_db_v14', text);
                const statusEl = document.getElementById('status-msg');
                statusEl.innerText = msg;
                statusEl.classList.add('text-emerald-500');
            }
        }

        function parseCSV(csv) {
            const lines = csv.split(/\r?\n/);
            courseData = {};
            let lastCourse = "";
            lines.forEach(line => {
                const cols = line.split(',').map(c => c.trim());
                if(cols.includes('H1')) { lastCourse = cols[0]; courseData[lastCourse] = {}; }
                else if(lastCourse && cols.length >= 10 && cols[1] !== "") { courseData[lastCourse][cols[0]] = cols.slice(1, 10).map(Number); }
            });
            const names = Object.keys(courseData);
            if(names.length > 0) updateCourseDropdown(names);
            return names.length > 0;
        }

        function filterByKana(char) {
            const all = Object.keys(courseData);
            updateCourseDropdown((char === '全') ? all : all.filter(n => n.startsWith(char)));
            toggleIndexPanel();
        }

        function updateCourseDropdown(list) {
            const sel = document.getElementById('course-select');
            sel.innerHTML = '<option value="">-- Choose Course --</option>' + 
                list.map(c => `<option value="${c}">${getDisplayName(c)}</option>`).join('');
            if(list.length === 1) sel.value = list[0];
        }

        function toggleIndexPanel() { 
            const el = document.getElementById('index-panel');
            el.classList.toggle('active');
        }

        function startRound() {
            const selected = document.getElementById('course-select').value;
            state.course = selected || document.getElementById('manual-course').value;
            if(!state.course) return alert("Please select a course to start.");
            state.section = courseData[state.course] ? Object.keys(courseData[state.course])[0] : "OUT";
            document.getElementById('settings-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            render();
        }

        function showSettings() {
            document.getElementById('settings-screen').classList.remove('hidden');
            document.getElementById('main-screen').classList.add('hidden');
        }

        function setHole(h) { state.hole = h; render(); }
        function setView(v) { state.view = v; render(); }

        function render() {
            document.getElementById('display-course').innerText = getDisplayName(state.course);
            document.getElementById('section-btn-label').innerText = state.section;
            document.getElementById('info-hole').innerText = `H${state.hole}`;
            const pars = (courseData[state.course] && courseData[state.course][state.section]) ? courseData[state.course][state.section] : [];
            document.getElementById('info-par').innerText = `PAR ${pars[state.hole-1] || '-'}`;
            document.getElementById('main-image').src = `img/${state.course}_${state.section}_${state.hole}_${state.view}.jpg`;

            for(let i=1; i<=9; i++) {
                const el = document.getElementById(`btn-h${i}`);
                if(i === state.hole) {
                    el.className = "flex-shrink-0 w-12 h-12 rounded-2xl bg-emerald-600 font-black text-lg text-white shadow-lg ring-2 ring-emerald-400";
                } else {
                    el.className = "flex-shrink-0 w-12 h-12 rounded-2xl bg-slate-800 font-black text-lg text-slate-500";
                }
            }
            document.getElementById('btn-map').className = `flex-1 rounded-xl font-black text-[10px] transition-all ${state.view==='map' ? 'footer-btn-active' : 'footer-btn-inactive'}`;
            document.getElementById('btn-green').className = `flex-1 rounded-xl font-black text-[10px] transition-all ${state.view==='green' ? 'footer-btn-active' : 'footer-btn-inactive'}`;
        }

        function handleImgError(el) {
            el.src = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 600'><rect width='400' height='600' fill='%23020617'/><text x='50%25' y='50%25' fill='%231e293b' font-size='12' text-anchor='middle' font-weight='bold'>YARDAGE NOT LOADED</text></svg>`;
        }

        function openFullscreen() {
            document.getElementById('fullscreen-image').src = document.getElementById('main-image').src;
            document.getElementById('fullscreen-overlay').classList.remove('hidden');
            document.getElementById('fullscreen-overlay').classList.add('flex');
        }

        function resetApp() { if(confirm("This will clear all course data. Proceed?")) { localStorage.clear(); location.reload(); } }

        init();
    </script>
</body>
</html>
