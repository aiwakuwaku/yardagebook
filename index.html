<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Golf Yardage PWA</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { height: 100dvh; display: flex; flex-direction: column; background-color: #f3f4f6; margin: 0; font-family: sans-serif; }
        .btn-gray { background-color: #f9fafb; border: 1px solid #d1d5db; color: #374151; }
        .btn-green { background-color: #057a3d; color: white; }
        .btn-red { background-color: #d32f2f; color: white; }
        .view-btn-active { background-color: #16a34a !important; color: white !important; }
        /* 五十音パネル用 */
        #index-panel { display: none; }
        #index-panel.active { display: grid; }
    </style>
</head>
<body class="text-gray-800">

    <!-- メイン画面（プレー中） -->
    <div id="main-screen" class="flex-1 flex flex-col hidden overflow-hidden bg-black text-white">
        <header class="bg-gray-800 p-2 flex justify-between items-center border-b border-gray-700 shrink-0">
            <div class="px-2 overflow-hidden">
                <h1 id="display-course" class="text-[10px] text-gray-400 truncate uppercase tracking-widest">COURSE</h1>
                <div id="display-section" class="text-base font-bold text-green-400 leading-tight">-</div>
            </div>
            <button onclick="showSettings()" class="p-2 bg-gray-700 rounded-lg">設定</button>
        </header>
        
        <nav class="bg-gray-800 shrink-0 border-b border-gray-900 overflow-x-auto no-scrollbar py-2 px-4 flex gap-3" id="hole-tabs"></nav>

        <main class="flex-1 relative flex items-center justify-center overflow-hidden" onclick="openFullscreen()">
            <img id="main-image" src="" class="max-h-full max-w-full object-contain relative z-10" onerror="this.src='https://via.placeholder.com/400x600?text=No+Image'">
            <div class="absolute top-4 left-4 z-20 bg-black/60 p-3 rounded-xl border border-white/10">
                <div id="info-hole" class="text-3xl font-black italic italic leading-none">H1</div>
                <div id="info-par" class="text-[10px] font-bold text-green-400 text-center uppercase mt-1">PAR -</div>
            </div>
        </main>

        <footer class="bg-gray-800 p-3 shrink-0 border-t border-gray-700 z-30">
            <div class="flex bg-gray-900 rounded-xl p-1 gap-1 max-w-md mx-auto">
                <button onclick="setView('map')" id="btn-map" class="flex-1 py-3 rounded-lg font-bold text-sm bg-green-600">全体図</button>
                <button onclick="setView('green')" id="btn-green" class="flex-1 py-3 rounded-lg font-bold text-sm bg-gray-700 text-gray-400">グリーン</button>
            </div>
        </footer>
    </div>

    <!-- 設定画面（UI再現） -->
    <div id="settings-screen" class="fixed inset-0 bg-gray-100 z-[100] p-4 flex flex-col overflow-y-auto">
        <div class="max-w-md mx-auto w-full space-y-4 pt-4">
            
            <!-- SELECT COURSE セクション -->
            <div>
                <label class="text-xs font-bold text-gray-500 mb-1 block uppercase">SELECT COURSE</label>
                <div class="flex gap-2 mb-2">
                    <button onclick="toggleIndexPanel()" class="w-1/4 py-3 rounded-lg btn-gray font-medium text-lg shadow-sm active:scale-95 transition-transform">Index</button>
                    <select id="course-select" class="flex-1 py-3 px-3 rounded-lg btn-gray text-lg shadow-sm outline-none">
                        <option value="">-- Select --</option>
                    </select>
                </div>
                
                <!-- 五十音パネル（Indexタップで表示） -->
                <div id="index-panel" class="grid grid-cols-5 gap-1 bg-white p-2 rounded-lg border mb-2 shadow-inner">
                    <!-- JSで あ か さ た な... を生成 -->
                </div>

                <input type="text" id="manual-course" placeholder="Course Name (Manual)" class="w-full py-3 px-4 rounded-lg btn-gray text-lg shadow-sm outline-none mb-4">
            </div>

            <!-- メインボタン -->
            <div class="flex gap-2 pt-2">
                <button onclick="startRound()" class="flex-1 py-4 btn-green rounded-lg font-black text-xl shadow-md active:bg-green-800">START ROUND</button>
                <button onclick="resetApp()" class="w-1/3 py-4 btn-red rounded-lg font-black text-lg shadow-md active:bg-red-800">RESET</button>
            </div>

            <!-- DATA SOURCE セクション -->
            <div class="pt-6">
                <label class="text-xs font-bold text-gray-500 mb-1 block uppercase">DATA SOURCE</label>
                <div class="flex gap-2">
                    <button onclick="loadServerCSV()" class="flex-1 py-3 rounded-lg btn-gray font-bold text-sm shadow-sm">Load Server CSV</button>
                    <button onclick="document.getElementById('file-input').click()" class="flex-1 py-3 rounded-lg btn-gray font-bold text-sm shadow-sm">Load Local CSV</button>
                </div>
                <input type="file" id="file-input" accept=".csv" class="hidden" onchange="loadLocalCSV(this)">
            </div>
            
            <div id="status-msg" class="text-center text-[10px] text-gray-400 mt-4 uppercase">No data loaded</div>
        </div>
    </div>

    <!-- フルスクリーン表示用 -->
    <div id="fullscreen-overlay" class="fixed inset-0 bg-black z-[200] hidden items-center justify-center" onclick="this.classList.add('hidden')">
        <img id="fullscreen-image" src="" class="w-full h-full object-contain">
    </div>

    <script>
        let courseData = {};
        let state = { course: "", section: "", hole: 1, view: "map" };
        const kana = ['あ', 'か', 'さ', 'た', 'な', 'は', 'ま', 'や', 'ら', 'わ', '全'];

        function init() {
            // ホールタブ
            const container = document.getElementById('hole-tabs');
            for(let i=1; i<=9; i++) {
                const btn = document.createElement('button');
                btn.id = `btn-h${i}`;
                btn.className = `flex-shrink-0 w-12 h-12 rounded-lg bg-gray-700 font-bold text-lg`;
                btn.innerText = i;
                btn.onclick = () => setHole(i);
                container.appendChild(btn);
            }

            // 五十音パネル生成
            const panel = document.getElementById('index-panel');
            kana.forEach(char => {
                const b = document.createElement('button');
                b.className = "py-3 bg-gray-100 rounded font-bold hover:bg-green-100 active:bg-green-500 active:text-white transition-colors";
                b.innerText = char;
                b.onclick = () => filterByKana(char);
                panel.appendChild(b);
            });

            const saved = localStorage.getItem('golf_db_v4');
            if(saved) parseCSV(saved);
        }

        // CSV読み込み関連
        async function loadServerCSV() {
            try {
                const res = await fetch('courses.csv');
                if(!res.ok) throw new Error();
                const text = await res.text();
                processData(text, "Server CSV Loaded");
            } catch(e) { alert("courses.csvが見つかりません"); }
        }

        function loadLocalCSV(input) {
            const reader = new FileReader();
            reader.onload = (e) => processData(e.target.result, "Local CSV Loaded");
            reader.readAsText(input.files[0]);
        }

        function processData(text, msg) {
            if(parseCSV(text)) {
                localStorage.setItem('golf_db_v4', text);
                document.getElementById('status-msg').innerText = msg;
            }
        }

        function parseCSV(csv) {
            const lines = csv.split(/\r?\n/);
            courseData = {};
            let lastCourse = "";
            lines.forEach(line => {
                const cols = line.split(',').map(c => c.trim());
                if(cols.includes('H1')) {
                    lastCourse = cols[0];
                    courseData[lastCourse] = {};
                } else if(lastCourse && cols.length >= 10 && cols[1] !== "") {
                    courseData[lastCourse][cols[0]] = cols.slice(1, 10).map(Number);
                }
            });
            const success = Object.keys(courseData).length > 0;
            if(success) updateCourseDropdown(Object.keys(courseData));
            return success;
        }

        // 検索・フィルタ関連
        function toggleIndexPanel() {
            document.getElementById('index-panel').classList.toggle('active');
        }

        function filterByKana(char) {
            const allCourses = Object.keys(courseData);
            if(char === '全') {
                updateCourseDropdown(allCourses);
            } else {
                // コース名（例：か06_クラウン）の先頭1文字で比較
                const filtered = allCourses.filter(name => name.startsWith(char));
                updateCourseDropdown(filtered);
            }
            toggleIndexPanel();
        }

        function updateCourseDropdown(list) {
            const sel = document.getElementById('course-select');
            sel.innerHTML = '<option value="">-- Select --</option>' + 
                list.map(c => `<option value="${c}">${c}</option>`).join('');
            if(list.length === 1) sel.value = list[0];
        }

        // ラウンド開始
        function startRound() {
            const selected = document.getElementById('course-select').value;
            const manual = document.getElementById('manual-course').value;
            state.course = selected || manual;

            if(!state.course) return alert("コースを選択するか入力してください");
            
            // セクション（OUT/IN等）は最初の一つを自動選択
            if(courseData[state.course]) {
                state.section = Object.keys(courseData[state.course])[0];
            } else {
                state.section = "OUT"; // Manual入力用
            }

            document.getElementById('settings-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            render();
        }

        function showSettings() {
            document.getElementById('settings-screen').classList.remove('hidden');
            document.getElementById('main-screen').classList.add('hidden');
        }

        function setHole(h) { state.hole = h; render(); }
        function setView(v) { state.view = v; render(); }

        function render() {
            document.getElementById('display-course').innerText = state.course;
            document.getElementById('display-section').innerText = state.section;
            document.getElementById('info-hole').innerText = `H${state.hole}`;
            
            const pars = (courseData[state.course] && courseData[state.course][state.section]) ? courseData[state.course][state.section] : [];
            document.getElementById('info-par').innerText = `PAR ${pars[state.hole-1] || '-'}`;
            
            const imgPath = `img/${state.course}_${state.section}_${state.hole}_${state.view}.jpg`;
            document.getElementById('main-image').src = imgPath;

            for(let i=1; i<=9; i++) {
                const el = document.getElementById(`btn-h${i}`);
                el.className = `flex-shrink-0 w-12 h-12 rounded-lg font-bold text-lg ${i===state.hole ? 'bg-green-600 ring-2 ring-white text-white' : 'bg-gray-700 text-gray-300'}`;
            }
            document.getElementById('btn-map').className = `flex-1 py-3 rounded-lg font-bold text-sm ${state.view==='map' ? 'bg-green-600 text-white' : 'bg-gray-700 text-gray-400'}`;
            document.getElementById('btn-green').className = `flex-1 py-3 rounded-lg font-bold text-sm ${state.view==='green' ? 'bg-green-600 text-white' : 'bg-gray-700 text-gray-400'}`;
        }

        function openFullscreen() {
            document.getElementById('fullscreen-image').src = document.getElementById('main-image').src;
            document.getElementById('fullscreen-overlay').classList.remove('hidden');
            document.getElementById('fullscreen-overlay').classList.add('flex');
        }

        function resetApp() {
            if(confirm("データをリセットしますか？")) {
                localStorage.clear();
                location.reload();
            }
        }

        init();
    </script>
</body>
</html>
