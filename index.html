<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Golf Yardage</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { height: 100dvh; display: flex; flex-direction: column; background-color: #000; margin: 0; overflow: hidden; color: white; font-family: sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .view-btn-active { background-color: #16a34a !important; color: white !important; border: 2px solid #4ade80 !important; }
        .view-btn-inactive { background-color: #374151 !important; color: #9ca3af !important; border: 2px solid transparent !important; }
        .active-hole { background-color: #16a34a !important; ring: 2px solid white; transform: scale(1.1); }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="bg-gray-800 p-2 flex justify-between items-center shrink-0 border-b border-gray-700">
        <div class="flex-1 px-2 overflow-hidden">
            <h1 id="display-course" class="text-[10px] text-gray-400 truncate tracking-widest uppercase">Course Name</h1>
            <div id="display-section" class="text-base font-bold text-green-400 leading-tight">CSVを読み込んでください</div>
        </div>
        <button onclick="toggleSettings()" class="p-2 bg-gray-700 rounded-lg active:bg-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
    </header>

    <!-- Hole Nav -->
    <nav class="bg-gray-800 shrink-0 border-b border-gray-900">
        <div id="hole-tabs" class="flex overflow-x-auto no-scrollbar py-3 px-4 gap-3"></div>
    </nav>

    <!-- Main View -->
    <main class="flex-1 relative bg-black flex items-center justify-center overflow-hidden" onclick="openFullscreen()">
        <!-- スピナー -->
        <div id="loading-spinner" class="absolute inset-0 flex items-center justify-center bg-gray-900 z-50">
            <div class="flex flex-col items-center">
                <div class="animate-spin h-10 w-10 border-4 border-green-500 border-t-transparent rounded-full mb-4"></div>
                <p class="text-xs text-gray-400">Loading Image...</p>
            </div>
        </div>
        
        <img id="main-image" src="" class="max-h-full max-w-full object-contain relative z-10" 
             onload="hideSpinner()" 
             onerror="handleImgError()">
        
        <!-- Info Overlay -->
        <div id="info-box" class="absolute top-4 left-4 z-20 bg-black/60 backdrop-blur-md px-4 py-2 rounded-xl border border-white/10 hidden">
            <div id="info-hole" class="text-3xl font-black italic leading-none">H1</div>
            <div id="info-par" class="text-[10px] font-bold text-green-400 text-center uppercase mt-1">PAR 4</div>
        </div>
    </main>

    <!-- Footer Switch -->
    <footer class="bg-gray-800 p-3 shrink-0 border-t border-gray-700 z-30">
        <div class="flex bg-gray-900 rounded-xl p-1 gap-1 max-w-md mx-auto">
            <button onclick="setView('map')" id="btn-map" class="flex-1 py-3 rounded-lg font-bold text-sm transition-all view-btn-active">全体図</button>
            <button onclick="setView('green')" id="btn-green" class="flex-1 py-3 rounded-lg font-bold text-sm transition-all view-btn-inactive">グリーン</button>
        </div>
        <div class="h-1"></div>
    </footer>

    <!-- Settings Overlay -->
    <div id="settings-overlay" class="fixed inset-0 bg-gray-900/98 z-[100] p-8 hidden flex-col">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-bold italic text-green-500">SETTINGS</h2>
            <button onclick="toggleSettings()" class="text-4xl text-gray-500">&times;</button>
        </div>
        <div class="space-y-6 flex-1 overflow-y-auto">
            <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                <p class="text-xs text-gray-400 mb-2 uppercase font-bold">1. Load Course Data</p>
                <input type="file" id="csv-file" accept=".csv" class="hidden">
                <button onclick="document.getElementById('csv-file').click()" class="w-full py-4 bg-blue-600 rounded-xl font-bold shadow-lg active:bg-blue-500">CSVファイルを選択</button>
                <p id="csv-status" class="text-[10px] mt-2 text-center text-gray-500">データ未読込</p>
            </div>
            
            <div id="selection-area" class="space-y-4 opacity-50 pointer-events-none">
                <p class="text-xs text-gray-400 uppercase font-bold">2. Select Course & Section</p>
                <select id="course-select" class="w-full bg-gray-800 p-4 rounded-xl text-lg border border-gray-700"></select>
                <select id="section-select" class="w-full bg-gray-800 p-4 rounded-xl text-lg border border-gray-700"></select>
                <button onclick="toggleSettings()" class="w-full py-4 bg-green-600 rounded-xl font-bold shadow-lg mt-4">完了してコースを見る</button>
            </div>
        </div>
    </div>

    <!-- Fullscreen -->
    <div id="fullscreen-overlay" class="fixed inset-0 bg-black z-[110] hidden items-center justify-center" onclick="this.classList.add('hidden')">
        <img id="fullscreen-image" src="" class="w-full h-full object-contain">
    </div>

    <script>
        let courseData = {};
        let state = { course: "", section: "", hole: 1, view: "map" };

        function init() {
            // ホールタブ生成
            const container = document.getElementById('hole-tabs');
            for(let i=1; i<=9; i++) {
                const btn = document.createElement('button');
                btn.id = `btn-h${i}`;
                btn.className = `flex-shrink-0 w-12 h-12 rounded-lg bg-gray-700 font-bold text-lg text-white`;
                btn.innerText = i;
                btn.onclick = () => setHole(i);
                container.appendChild(btn);
            }

            // CSV読込
            document.getElementById('csv-file').onchange = (e) => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    if (parseCSV(ev.target.result)) {
                        localStorage.setItem('golf_db_v3', ev.target.result);
                        document.getElementById('csv-status').innerText = "読込成功！";
                        document.getElementById('selection-area').style.opacity = "1";
                        document.getElementById('selection-area').style.pointerEvents = "auto";
                    } else {
                        alert("CSVの形式が正しくありません。");
                    }
                };
                reader.readAsText(e.target.files[0]);
            };

            const saved = localStorage.getItem('golf_db_v3');
            if(saved) {
                parseCSV(saved);
                document.getElementById('selection-area').style.opacity = "1";
                document.getElementById('selection-area').style.pointerEvents = "auto";
            } else {
                // 初回起動時、データがなければ設定画面を強制表示
                setTimeout(toggleSettings, 500);
            }

            document.getElementById('course-select').onchange = (e) => { state.course = e.target.value; updateSectionOptions(); };
            document.getElementById('section-select').onchange = (e) => { state.section = e.target.value; render(); };
        }

        function parseCSV(csv) {
            const lines = csv.split(/\r?\n/);
            courseData = {};
            let lastCourse = "";
            let count = 0;

            lines.forEach(line => {
                const cols = line.split(',').map(c => c.trim());
                if (!cols[0] && !cols[1]) return;

                if (cols[1] === 'H1') {
                    lastCourse = cols[0];
                    courseData[lastCourse] = {};
                } else if (lastCourse && cols.length >= 10 && cols[1] !== "") {
                    const sectionName = cols[0];
                    const pars = cols.slice(1, 10).map(Number);
                    if (!isNaN(pars[0])) {
                        courseData[lastCourse][sectionName] = pars;
                        count++;
                    }
                }
            });

            if (count > 0) {
                updateCourseOptions();
                return true;
            }
            return false;
        }

        function updateCourseOptions() {
            const sel = document.getElementById('course-select');
            const courses = Object.keys(courseData);
            sel.innerHTML = courses.map(c => `<option value="${c}">${c}</option>`).join('');
            state.course = courses[0];
            updateSectionOptions();
        }

        function updateSectionOptions() {
            const sel = document.getElementById('section-select');
            const sections = Object.keys(courseData[state.course]);
            sel.innerHTML = sections.map(s => `<option value="${s}">${s}</option>`).join('');
            state.section = sections[0];
            render();
        }

        function setHole(h) { state.hole = h; render(); }
        function setView(v) { state.view = v; render(); }

        function hideSpinner() {
            document.getElementById('loading-spinner').style.display = 'none';
        }

        function handleImgError() {
            hideSpinner();
            const mainImg = document.getElementById('main-image');
            mainImg.src = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 500'><rect width='400' height='500' fill='%23111827'/><text x='50%25' y='50%25' fill='%23ef4444' font-family='sans-serif' font-size='16' text-anchor='middle'>画像が見つかりません</text><text x='50%25' y='58%25' fill='%236b7280' font-family='sans-serif' font-size='12' text-anchor='middle'>${state.course}_${state.section}_${state.hole}_${state.view}.jpg</text></svg>`;
        }

        function render() {
            if(!state.course || !state.section) return;

            document.getElementById('info-box').classList.remove('hidden');
            document.getElementById('display-course').innerText = state.course;
            document.getElementById('display-section').innerText = state.section;
            document.getElementById('info-hole').innerText = `H${state.hole}`;
            document.getElementById('info-par').innerText = `PAR ${courseData[state.course][state.section][state.hole-1]}`;
            
            // くるくるを表示
            document.getElementById('loading-spinner').style.display = 'flex';
            
            // 画像パス
            const imgPath = `img/${state.course}_${state.section}_${state.hole}_${state.view}.jpg`;
            document.getElementById('main-image').src = imgPath;

            // スタイル更新
            for(let i=1; i<=9; i++) {
                const el = document.getElementById(`btn-h${i}`);
                if(i === state.hole) el.className = "flex-shrink-0 w-12 h-12 rounded-lg bg-green-600 font-bold text-lg text-white scale-110 ring-2 ring-white/30";
                else el.className = "flex-shrink-0 w-12 h-12 rounded-lg bg-gray-700 font-bold text-lg text-white";
            }
            document.getElementById('btn-map').className = `flex-1 py-3 rounded-lg font-bold text-sm transition-all ${state.view==='map' ? 'view-btn-active' : 'view-btn-inactive'}`;
            document.getElementById('btn-green').className = `flex-1 py-3 rounded-lg font-bold text-sm transition-all ${state.view==='green' ? 'view-btn-active' : 'view-btn-inactive'}`;
        }

        function toggleSettings() {
            const el = document.getElementById('settings-overlay');
            el.classList.toggle('hidden');
            el.classList.toggle('flex');
        }

        function openFullscreen() {
            const overlay = document.getElementById('fullscreen-overlay');
            document.getElementById('fullscreen-image').src = document.getElementById('main-image').src;
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
        }

        init();
    </script>
</body>
</html>
