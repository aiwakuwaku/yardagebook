<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Golf Yardage</title>
    
    <link rel="manifest" href="manifest.json?v=12">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <style>
        :root { --emerald: #059669; --slate-800: #1e293b; --slate-900: #0f172a; --slate-950: #020617; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; background: #000; font-family: sans-serif; overflow: hidden; display: flex; justify-content: center; }
        .app-wrap { width: 100%; max-width: 480px; height: 100%; background: var(--slate-950); display: flex; flex-direction: column; position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.8); }
        header { height: 60px; background: var(--slate-800); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #334155; flex-shrink: 0; z-index: 100; }
        .hole-nav { height: 70px; background: var(--slate-900); display: flex; align-items: center; padding: 0 10px; overflow-x: scroll; border-bottom: 2px solid #000; z-index: 100; flex-shrink: 0; }
        .hole-nav::-webkit-scrollbar { display: none; }
        .hole-btn { min-width: 46px; width: 46px; height: 46px; margin: 0 5px; border-radius: 12px; border: none; font-size: 18px; font-weight: 900; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; transition: 0.2s; }
        .h-active { background: var(--emerald); color: white; transform: scale(1.05); }
        .h-inactive { background: var(--slate-800); color: #64748b; }
        main { flex: 1; background: #000; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; z-index: 10; }
        #main-image { width: 100%; height: 100%; object-fit: contain; }
        .info-panel { position: absolute; top: 15px; left: 15px; background: rgba(15, 23, 42, 0.9); padding: 10px 18px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.1); color: white; pointer-events: none; z-index: 20; }
        footer { height: 100px; background: var(--slate-900); display: flex; align-items: center; justify-content: center; padding-bottom: env(safe-area-inset-bottom); border-top: 1px solid #1e293b; z-index: 100; flex-shrink: 0; }
        .ctrl-bar { background: var(--slate-950); width: 92%; height: 62px; border-radius: 18px; display: flex; padding: 5px; gap: 5px; }
        .f-btn { flex: 1; border-radius: 12px; border: none; font-weight: 900; font-size: 11px; cursor: pointer; transition: 0.2s; }
        .f-active { background: var(--emerald); color: white; }
        .f-inactive { background: var(--slate-800); color: #475569; }
        .sec-btn { width: 90px; background: #f59e0b; color: #000; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid #fff; font-weight: 900; cursor: pointer; }
        #settings-screen { position: absolute; inset: 0; background: #f1f5f9; z-index: 2000; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; border-radius: 24px; border: 1px solid #e2e8f0; padding: 20px; width: 100%; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .select-row { display: flex; gap: 8px; width: 100%; margin-bottom: 15px; }
        #course-select { flex: 1; min-width: 0; padding: 12px; border-radius: 12px; background: #f8fafc; border: 1px solid #e2e8f0; font-weight: 700; font-size: 16px; }
        .kana-grid { display: none; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 15px; width: 100%; }
        .kana-grid.active { display: grid; }
        .k-btn { height: 44px; border-radius: 10px; border: 1px solid #e2e8f0; background: white; font-weight: 800; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="app-wrap">
        <div id="main-screen" class="hidden" style="display:contents;">
            <header>
                <div id="display-course" style="color:white; font-weight:900; font-style:italic; text-transform:uppercase; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;">COURSE</div>
                <button onclick="openSettings()" style="background:var(--emerald); color:white; border:none; padding:7px 12px; border-radius:20px; font-weight:900; font-size:10px;">SETTINGS</button>
            </header>
            <div id="hole-tabs" class="hole-nav"></div>
            <main onclick="toggleFullscreen()">
                <img id="main-image" src="" onerror="handleImgError(this)">
                <div class="info-panel">
                    <div id="info-hole" style="font-size: 32px; font-weight: 900; font-style: italic; line-height: 1;">H1</div>
                    <div id="info-par" style="font-size: 10px; font-weight: 900; color: #34d399; text-align: center; margin-top: 4px;">PAR -</div>
                </div>
            </main>
            <footer>
                <div class="ctrl-bar">
                    <button onclick="changeSection()" id="btn-sec" class="sec-btn"><span style="font-size: 8px; opacity: 0.8;">SECTION</span><span id="label-sec">OUT</span></button>
                    <button onclick="changeView('map')" id="btn-map" class="f-btn">MAP</button>
                    <button onclick="changeView('green')" id="btn-green" class="f-btn">GREEN</button>
                </div>
            </footer>
        </div>
        <div id="settings-screen">
            <div style="text-align: center; margin: 30px 0;"><h1 style="font-size: 28px; font-weight: 900; font-style: italic; margin: 0; color: #1e293b;">GOLF YARDAGE</h1></div>
            <div class="card">
                <label style="font-size: 10px; font-weight: 900; color: #94a3b8; display: block; margin-bottom: 8px;">Select Course</label>
                <div class="select-row">
                    <button onclick="document.getElementById('k-grid').classList.toggle('active')" style="background: #1e293b; color: white; border: none; padding: 12px; border-radius: 12px; width: 75px;">INDEX</button>
                    <select id="course-select"></select>
                </div>
                <div id="k-grid" class="kana-grid"></div>
                <button onclick="startRound()" style="width: 100%; background: var(--emerald); color: white; border: none; padding: 18px; border-radius: 15px; font-size: 18px; font-weight: 900;">START ROUND</button>
            </div>
            <div style="margin-top: 20px; width: 100%; display: flex; gap: 10px;">
                <button onclick="loadSrv()" style="flex: 1; padding: 12px; background: white; border: 1px solid #ddd; border-radius: 12px; font-size: 10px; font-weight: 900;">LOAD SERVER</button>
            </div>
            <p id="msg" style="font-size: 9px; color: #94a3b8; margin-top: 15px; font-weight: 700;">READY</p>
        </div>
    </div>
    <div id="fs-overlay" class="hidden" style="position:fixed; inset:0; background:rgba(0,0,0,0.98); z-index:3000; display:flex; align-items:center; justify-content:center;" onclick="this.classList.add('hidden')"><img id="fs-img" src="" style="width: 100%; height: 100%; object-fit: contain;"></div>

    <script>
        let db = {}; let st = { course: "", sec: "", hole: 1, view: "map" };
        window.addEventListener('DOMContentLoaded', () => {
            if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js?v=12'); }
            const tabs = document.getElementById('hole-tabs');
            for(let i=1; i<=9; i++) {
                const b = document.createElement('button'); b.className = "hole-btn h-inactive"; b.id = `hbtn-${i}`; b.innerText = i;
                b.onclick = (e) => { e.preventDefault(); clickHole(i); }; tabs.appendChild(b);
            }
            const kana = ['あ', 'か', 'さ', 'た', 'な', 'は', 'ま', 'や', 'ら', 'わ', '全'];
            const grid = document.getElementById('k-grid');
            kana.forEach(k => { const b = document.createElement('button'); b.className = "k-btn"; b.innerText = k; b.onclick = () => filterKana(k); grid.appendChild(b); });
            const saved = localStorage.getItem('golf_db_v18'); if(saved) parse(saved);
        });
        function parse(csv) {
            const lines = csv.split(/\r?\n/); db = {}; let cur = "";
            lines.forEach(l => { if(!l.trim()) return; const c = l.split(',').map(s => s.trim()); if(c.includes('H1')) { cur = c[0]; db[cur] = {}; } else if(cur && c.length >= 10 && c[1] !== "") { db[cur][c[0]] = c.slice(1, 10).map(Number); } });
            buildSelect(Object.keys(db));
        }
        function buildSelect(list) { const s = document.getElementById('course-select'); s.innerHTML = '<option value="">-- CHOOSE --</option>' + list.map(n => `<option value="${n}">${n.includes('_') ? n.split('_').slice(1).join('_') : n}</option>`).join(''); }
        function filterKana(k) { const all = Object.keys(db); buildSelect(k === '全' ? all : all.filter(n => n.startsWith(k))); document.getElementById('k-grid').classList.remove('active'); }
        function startRound() { const c = document.getElementById('course-select').value; if(!c) return alert("Select course"); st.course = c; st.sec = Object.keys(db[c])[0]; st.hole = 1; st.view = "map"; document.getElementById('settings-screen').classList.add('hidden'); document.getElementById('main-screen').classList.remove('hidden'); ui(); }
        function openSettings() { document.getElementById('settings-screen').classList.remove('hidden'); document.getElementById('main-screen').classList.add('hidden'); }
        function clickHole(n) { st.hole = n; ui(); }
        function changeView(v) { st.view = v; ui(); }
        function changeSection() { const secs = Object.keys(db[st.course]); if(secs.length <= 1) return; st.sec = secs[(secs.indexOf(st.sec) + 1) % secs.length]; ui(); }
        function ui() {
            document.getElementById('display-course').innerText = st.course.includes('_') ? st.course.split('_').slice(1).join('_') : st.course;
            document.getElementById('label-sec').innerText = st.sec; document.getElementById('info-hole').innerText = `H${st.hole}`;
            const pars = db[st.course][st.sec] || []; document.getElementById('info-par').innerText = `PAR ${pars[st.hole-1] || '-'}`;
            document.getElementById('main-image').src = `img/${st.course}_${st.sec}_${st.hole}_${st.view}.jpg?v=${new Date().getTime()}`;
            for(let i=1; i<=9; i++) { const b = document.getElementById(`hbtn-${i}`); b.className = (i === st.hole) ? "hole-btn h-active" : "hole-btn h-inactive"; }
            document.getElementById('btn-map').className = `f-btn ${st.view === 'map' ? 'f-active' : 'f-inactive'}`;
            document.getElementById('btn-green').className = `f-btn ${st.view === 'green' ? 'f-active' : 'f-inactive'}`;
        }
        async function loadSrv() { try { const res = await fetch('courses.csv'); const txt = await res.text(); parse(txt); localStorage.setItem('golf_db_v18', txt); document.getElementById('msg').innerText = "LOADED"; } catch(e) { alert("Fail"); } }
        function handleImgError(el) { el.src = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 600'><rect width='400' height='600' fill='%23020617'/><text x='50%25' y='50%25' fill='%231e293b' font-size='16' text-anchor='middle'>NO IMAGE</text></svg>`; }
        function toggleFullscreen() { const img = document.getElementById('main-image').src; if(img.startsWith('data:')) return; document.getElementById('fs-img').src = img; document.getElementById('fs-overlay').classList.remove('hidden'); }
    </script>
</body>
</html>
