<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Golf Yardage PWA</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            height: 100vh; height: 100dvh; 
            display: flex; flex-direction: column; 
            background-color: #f3f4f6; margin: 0; overflow: hidden; 
            font-family: sans-serif; -webkit-tap-highlight-color: transparent; 
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .btn-gray { background-color: #f9fafb; border: 1px solid #d1d5db; color: #374151; }
        .btn-green { background-color: #057a3d; color: white; }
        .btn-red { background-color: #d32f2f; color: white; }
        
        .footer-btn-active { background-color: #057a3d !important; color: white !important; border: 1px solid #4ade80 !important; }
        .footer-btn-inactive { background-color: #1f2937 !important; color: #6b7280 !important; border: 1px solid transparent !important; }
        
        .section-badge-active {
            background-color: #fbbf24 !important;
            color: #000 !important;
            font-weight: 900;
            border: 2px solid #fff !important;
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
        }

        #index-panel { display: none; }
        #index-panel.active { display: grid; }
        
        footer { padding-bottom: calc(0.75rem + env(safe-area-inset-bottom)); }
    </style>
</head>
<body class="text-gray-800">

    <!-- プレー画面 -->
    <div id="main-screen" class="flex-1 flex flex-col hidden overflow-hidden bg-black text-white">
        <!-- ヘッダー -->
        <header class="bg-gray-800 p-3 flex justify-between items-center border-b border-gray-700 flex-none">
            <div class="flex-1 px-2 overflow-hidden">
                <h1 id="display-course" class="text-sm text-gray-400 truncate font-bold">COURSE NAME</h1>
            </div>
            <button onclick="showSettings()" class="py-1 px-3 bg-gray-700 rounded-lg text-[10px] border border-gray-600 text-gray-300 font-black tracking-tighter uppercase">Settings</button>
        </header>
        
        <nav class="bg-gray-800 flex-none border-b border-gray-900 overflow-x-auto no-scrollbar py-2 px-4 flex gap-3" id="hole-tabs"></nav>

        <main class="flex-1 relative flex items-center justify-center overflow-hidden bg-black" onclick="openFullscreen()">
            <img id="main-image" src="" class="max-h-full max-w-full object-contain relative z-10" onerror="handleImgError(this)">
            <div class="absolute top-4 left-4 z-20 bg-black/60 p-3 rounded-xl border border-white/10 backdrop-blur-sm shadow-2xl">
                <div id="info-hole" class="text-4xl font-black italic leading-none text-white tracking-tighter">H1</div>
                <div id="info-par" class="text-[10px] font-black text-green-400 text-center uppercase mt-1 tracking-widest">PAR -</div>
            </div>
        </main>

        <!-- フッター -->
        <footer class="bg-gray-800 p-3 flex-none border-t border-gray-900 z-30">
            <div class="flex bg-gray-950 rounded-2xl p-1 gap-1 max-w-md mx-auto h-16 shadow-inner">
                <button onclick="cycleSection()" id="btn-section-toggle" class="w-24 rounded-xl flex flex-col items-center justify-center active:scale-95 transition-all shrink-0 section-badge-active">
                    <span class="text-[8px] uppercase font-black opacity-70 leading-none mb-1 tracking-tighter text-black">Section</span>
                    <span id="section-btn-label" class="text-sm font-black tracking-widest uppercase">OUT</span>
                </button>
                <button onclick="setView('map')" id="btn-map" class="flex-1 rounded-xl font-black text-xs transition-all footer-btn-active uppercase tracking-tighter">全体図</button>
                <button onclick="setView('green')" id="btn-green" class="flex-1 rounded-xl font-black text-xs transition-all footer-btn-inactive uppercase tracking-tighter">グリーン</button>
            </div>
        </footer>
    </div>

    <!-- 設定画面 -->
    <div id="settings-screen" class="fixed inset-0 bg-gray-100 z-[100] p-4 flex flex-col overflow-y-auto">
        <div class="max-w-md mx-auto w-full space-y-4 pt-2 pb-10 text-center">
            
            <div class="flex flex-col items-center py-6">
                <div class="flex items-center gap-2">
                    <svg class="w-10 h-10 text-green-700" fill="currentColor" viewBox="0 0 24 24"><path d="M19.32,15C17.79,15.15 16.42,15.7 15.28,16.5L10.21,11.43C10.72,10.5 11,9.33 11,8C11,4.13 7.87,1 4,1C3.45,1 3,1.45 3,2C3,2.55 3.45,3 4,3C6.76,3 9,5.24 9,8C9,10.76 6.76,13 4,13C3.45,13 3,13.45 3,14C3,14.55 3.45,15 4,15C5.33,15 6.5,14.72 7.57,14.21L12.64,19.28C11.84,20.42 11.29,21.79 11.14,23.32C11.11,23.71 11.41,24 11.8,24H12.2C12.55,24 12.85,23.73 12.88,23.38C13.15,20.25 15.75,17.65 18.88,17.38C19.23,17.35 19.5,17.05 19.5,16.7V16.3C19.5,15.91 19.21,15.61 18.82,15.58C18.91,15.58 19.11,15.54 19.32,15Z"/></svg>
                    <h1 class="text-3xl font-black text-gray-800 tracking-tighter italic uppercase">GOLF YARDAGE</h1>
                </div>
                <div class="text-[10px] font-bold text-gray-400 tracking-[0.4em] uppercase mt-2">Digital Yardage Book</div>
            </div>
            
            <div class="text-left">
                <label class="text-[10px] font-bold text-gray-400 mb-1 block uppercase tracking-widest">SELECT COURSE</label>
                <div class="flex gap-2 mb-2">
                    <button onclick="toggleIndexPanel()" class="w-1/4 py-4 rounded-xl btn-gray font-black text-lg shadow-sm">Index</button>
                    <!-- 表示名のみ加工 -->
                    <select id="course-select" class="flex-1 py-4 px-3 rounded-xl btn-gray text-base shadow-sm outline-none font-bold truncate"></select>
                </div>
                <div id="index-panel" class="grid grid-cols-5 gap-1 bg-white p-2 rounded-xl border mb-2 shadow-inner"></div>
                <input type="text" id="manual-course" placeholder="Course Name (Manual)" class="w-full py-4 px-4 rounded-xl btn-gray text-base shadow-sm outline-none mb-4 font-bold">
            </div>

            <div class="flex gap-2 pt-4">
                <button onclick="startRound()" class="flex-1 py-5 btn-green rounded-2xl font-black text-2xl shadow-xl active:opacity-80 uppercase italic tracking-tighter">START ROUND</button>
                <button onclick="resetApp()" class="w-1/3 py-5 btn-red rounded-2xl font-black text-lg shadow-xl active:opacity-80 uppercase tracking-tighter">RESET</button>
            </div>

            <div class="pt-10 text-left">
                <label class="text-[10px] font-bold text-gray-400 mb-2 block uppercase tracking-widest">DATA SOURCE</label>
                <div class="flex gap-2">
                    <button onclick="loadServerCSV()" class="flex-1 py-3 rounded-xl btn-gray font-bold text-[10px] shadow-sm uppercase tracking-tighter">Load Server CSV</button>
                    <button onclick="document.getElementById('file-input').click()" class="flex-1 py-3 rounded-xl btn-gray font-bold text-[10px] shadow-sm uppercase tracking-tighter">Load Local CSV</button>
                </div>
                <input type="file" id="file-input" accept=".csv" class="hidden" onchange="loadLocalCSV(this)">
            </div>
            <div id="status-msg" class="text-center text-[10px] text-gray-400 mt-10 uppercase font-black tracking-[0.2em]">Ready to load data</div>
        </div>
    </div>

    <!-- フルスクリーン -->
    <div id="fullscreen-overlay" class="fixed inset-0 bg-black z-[200] hidden items-center justify-center" onclick="this.classList.add('hidden')">
        <img id="fullscreen-image" src="" class="w-full h-full object-contain">
    </div>

    <script>
        let courseData = {};
        let state = { course: "", section: "", hole: 1, view: "map" };
        const kana = ['あ', 'か', 'さ', 'た', 'な', 'は', 'ま', 'や', 'ら', 'わ', '全'];

        // ★表示用コース名を生成する関数（"あ01_池田" -> "池田"）
        function getDisplayName(fullName) {
            if (!fullName) return "";
            return fullName.includes('_') ? fullName.split('_').slice(1).join('_') : fullName;
        }

        function init() {
            const container = document.getElementById('hole-tabs');
            for(let i=1; i<=9; i++) {
                const btn = document.createElement('button');
                btn.id = `btn-h${i}`;
                btn.className = `flex-shrink-0 w-12 h-12 rounded-lg bg-gray-700 font-bold text-lg`;
                btn.innerText = i;
                btn.onclick = () => setHole(i);
                container.appendChild(btn);
            }
            const panel = document.getElementById('index-panel');
            kana.forEach(char => {
                const b = document.createElement('button');
                b.className = "py-4 bg-gray-50 rounded-lg font-black text-gray-700 active:bg-green-600 active:text-white transition-all";
                b.innerText = char;
                b.onclick = () => filterByKana(char);
                panel.appendChild(b);
            });
            const saved = localStorage.getItem('golf_db_v13');
            if(saved) parseCSV(saved);
        }

        function cycleSection() {
            if(!state.course || !courseData[state.course]) return;
            const sections = Object.keys(courseData[state.course]);
            if(sections.length <= 1) return;
            state.section = sections[(sections.indexOf(state.section) + 1) % sections.length];
            render();
        }

        async function loadServerCSV() {
            try {
                const res = await fetch('courses.csv');
                processData(await res.text(), "Server CSV Loaded");
            } catch(e) { alert("Server CSV Error"); }
        }

        function loadLocalCSV(input) {
            const reader = new FileReader();
            reader.onload = (e) => processData(e.target.result, "Local CSV Loaded");
            reader.readAsText(input.files[0]);
        }

        function processData(text, msg) {
            if(parseCSV(text)) {
                localStorage.setItem('golf_db_v13', text);
                document.getElementById('status-msg').innerText = msg;
            }
        }

        function parseCSV(csv) {
            const lines = csv.split(/\r?\n/);
            courseData = {};
            let lastCourse = "";
            lines.forEach(line => {
                const cols = line.split(',').map(c => c.trim());
                if(cols.includes('H1')) { lastCourse = cols[0]; courseData[lastCourse] = {}; }
                else if(lastCourse && cols.length >= 10 && cols[1] !== "") { courseData[lastCourse][cols[0]] = cols.slice(1, 10).map(Number); }
            });
            const names = Object.keys(courseData);
            if(names.length > 0) updateCourseDropdown(names);
            return names.length > 0;
        }

        function filterByKana(char) {
            const all = Object.keys(courseData);
            updateCourseDropdown((char === '全') ? all : all.filter(n => n.startsWith(char)));
            toggleIndexPanel();
        }

        function updateCourseDropdown(list) {
            const sel = document.getElementById('course-select');
            // valueはフルネーム、表示テキストはgetDisplayNameを使用
            sel.innerHTML = '<option value="">-- Select --</option>' + 
                list.map(c => `<option value="${c}">${getDisplayName(c)}</option>`).join('');
            if(list.length === 1) sel.value = list[0];
        }

        function toggleIndexPanel() { document.getElementById('index-panel').classList.toggle('active'); }

        function startRound() {
            const selected = document.getElementById('course-select').value;
            state.course = selected || document.getElementById('manual-course').value;
            if(!state.course) return alert("Select course");
            if(courseData[state.course]) {
                state.section = Object.keys(courseData[state.course])[0];
            } else {
                state.section = "OUT";
            }
            document.getElementById('settings-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            render();
        }

        function showSettings() {
            document.getElementById('settings-screen').classList.remove('hidden');
            document.getElementById('main-screen').classList.add('hidden');
        }

        function setHole(h) { state.hole = h; render(); }
        function setView(v) { state.view = v; render(); }

        function render() {
            // 表示のみ getDisplayName を使用
            document.getElementById('display-course').innerText = getDisplayName(state.course);
            document.getElementById('section-btn-label').innerText = state.section;
            document.getElementById('info-hole').innerText = `H${state.hole}`;
            const pars = (courseData[state.course] && courseData[state.course][state.section]) ? courseData[state.course][state.section] : [];
            document.getElementById('info-par').innerText = `PAR ${pars[state.hole-1] || '-'}`;
            
            // 画像パスは元の state.course (あ01_池田...) を使う
            document.getElementById('main-image').src = `img/${state.course}_${state.section}_${state.hole}_${state.view}.jpg`;

            for(let i=1; i<=9; i++) {
                document.getElementById(`btn-h${i}`).className = `flex-shrink-0 w-12 h-12 rounded-lg font-black text-lg ${i===state.hole ? 'bg-green-600 ring-2 ring-white text-white shadow-lg' : 'bg-gray-700 text-gray-400'}`;
            }
            document.getElementById('btn-map').className = `flex-1 rounded-xl font-black text-xs transition-all ${state.view==='map' ? 'footer-btn-active' : 'footer-btn-inactive'}`;
            document.getElementById('btn-green').className = `flex-1 rounded-xl font-black text-xs transition-all ${state.view==='green' ? 'footer-btn-active' : 'footer-btn-inactive'}`;
        }

        function handleImgError(el) {
            el.src = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 600'><rect width='400' height='600' fill='%23111'/><text x='50%25' y='50%25' fill='%23444' font-size='12' text-anchor='middle'>NO IMAGE FOUND</text></svg>`;
        }

        function openFullscreen() {
            document.getElementById('fullscreen-image').src = document.getElementById('main-image').src;
            document.getElementById('fullscreen-overlay').classList.remove('hidden');
            document.getElementById('fullscreen-overlay').classList.add('flex');
        }

        function resetApp() { if(confirm("Reset all data?")) { localStorage.clear(); location.reload(); } }

        init();
    </script>
</body>
</html>
